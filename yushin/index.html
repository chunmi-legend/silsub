<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>유신 체제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* 레이아웃: 화면 하나에 움직이는 도해 하나. 위에 짧은 제목, 아래는 도해가 화면을 채운다. */
:root {
  --paper: #f3f4f1;
  --sheet: #fbfbf9;
  --ink: #1d2422;
  --ink-2: #56615d;
  --rule: #d3d8d4;
  --south: #1f5873;
  --south-soft: #dbe7ec;
  --north: #8a3b32;
  --seal: #c0352b;
  --gold: #a87a1c;
  --gold-soft: #f6e7b8;
  --mute: #a2aba7;
  --f-display: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #161b1a; --sheet: #1d2321; --ink: #e8ece9; --ink-2: #a9b4b0; --rule: #34403c;
  --south: #79b4cf; --south-soft: #20343d; --north: #df8f84;
  --seal: #ef6a5d; --gold: #d9ad55; --gold-soft: #5a4a1e; --mute: #6b7773; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #161b1a; --sheet: #1d2321; --ink: #e8ece9; --ink-2: #a9b4b0; --rule: #34403c;
  --south: #79b4cf; --south-soft: #20343d; --north: #df8f84;
  --seal: #ef6a5d; --gold: #d9ad55; --gold-soft: #5a4a1e; --mute: #6b7773; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; word-break: keep-all; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
/* 전자칠판 터치: 두 번 탭 확대와 길게 눌러 글자 선택 막기 */
button, a, input, .fig { touch-action: manipulation; }
.fig, .tabs, .chips, .legend { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }

.top { background: var(--sheet); border-bottom: 1px solid var(--rule); }
.top-in { display: flex; align-items: center; gap: 24px; padding-block: 8px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-display); font-weight: 800; font-size: .95rem; white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.tabs a { flex: none; display: grid; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .86rem; line-height: 1.25; padding: 6px 14px; border-radius: 4px; }
.tabs a small { font-weight: 400; font-size: .66rem; color: var(--ink-2); }
.tabs a:hover { color: var(--ink); background: var(--paper); }
.tabs a[aria-current="true"] { color: var(--sheet); background: var(--ink); }
.tabs a[aria-current="true"] small { color: var(--sheet); opacity: .7; }
#fsBtn { font: 500 .74rem var(--f-body); color: var(--ink-2); background: transparent; border: 1px solid var(--rule); border-radius: 4px; padding: 5px 9px; cursor: pointer; flex: none; }
.lesson-link { flex: none; font: 600 .78rem var(--f-body); color: var(--sheet); background: var(--seal); text-decoration: none; border-radius: 4px; padding: 6px 11px; white-space: nowrap; }
.lesson-link:hover { filter: brightness(1.08); }
@media (max-width: 720px) { .brand, #fsBtn { display: none; } }

main { min-height: 0; overflow: auto; }
.page { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding-block: 18px 22px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 28px; flex-wrap: wrap; }
.head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.4rem, 2.4vw, 2rem); line-height: 1.25; margin: 0; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--ink-2); font-size: .92rem; max-width: 46em; }
.ctrls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 .8rem var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 5px; padding: 7px 13px; cursor: pointer; }
.btn:hover { background: var(--sheet); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

.fig { position: relative; width: min(100%, calc((100dvh - 210px) * 1.786)); min-width: min(100%, 560px); aspect-ratio: 1000 / 560; margin-inline: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.fig.short { width: min(100%, calc((100dvh - 270px) * 1.786)); }
.fig svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
svg text { font-family: var(--f-body); }
.t { fill: var(--ink); font-size: 15px; }
.t2 { fill: var(--ink-2); font-size: 13px; }
.tb { fill: var(--ink); font-size: 17px; font-weight: 700; }
.tm { fill: var(--ink-2); font-family: var(--f-mono); font-size: 12px; }
.big { font-family: var(--f-display); font-weight: 800; fill: var(--ink); }
.mid { text-anchor: middle; } .end { text-anchor: end; }
.fade { transition: opacity .6s ease; }

/* 범례 버튼 (제2대 국회) */
.legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.legend button { display: flex; align-items: baseline; gap: 10px; font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 14px; cursor: pointer; }
.legend button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.legend i { width: 12px; height: 12px; border-radius: 50%; align-self: center; }
.legend span { font-size: .86rem; }
.legend small { color: var(--ink-2); font-size: .72rem; }
.legend b { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }

/* 재생 막대 (사사오입) */
.scrub { display: flex; align-items: center; gap: 12px; width: min(100%, calc((100dvh - 270px) * 1.786)); margin-inline: auto; }
.scrub input { flex: 1; min-width: 0; accent-color: var(--seal); }
.chips { display: flex; gap: 4px; }
.chips button { font: 500 .74rem var(--f-body); color: var(--ink-2); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chips button.on { color: var(--seal); border-color: var(--seal); }
.hint { flex: 1; min-width: 0; text-align: right; font-size: .76rem; color: var(--ink-2); }
.btn:disabled { opacity: .35; cursor: default; }

@media (max-width: 720px) {
  .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .fig, .scrub { width: 100%; min-width: 0; }
  .scrub { flex-wrap: wrap; }
}

/* 등장인물·정당 색 */
:root { --skin: #efcfae; --v1: #c58f5c; --v2: #7c9767; --v3: #8a7bb2; --v4: #c47a78; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-in">
      <span class="brand">5·16 군사 정변과 유신 체제</span>
      <nav class="tabs" aria-label="화면">
        <a href="#power"><small>1972 · 10월 유신</small>유신 헌법과 대통령 권한</a>
        <a href="#election78"><small>1978</small>10대 국회의원 선거</a>
      </nav>
      <a class="lesson-link" data-lesson="2" href="419.html">◀ 이전 차시</a>
      <button type="button" id="fsBtn">전체 화면</button>
    </div>
  </header>

  <main>
    <!-- 유신 헌법과 대통령 권한 -->
    <section class="page" id="p-power" data-name="power">
      <div class="head">
        <div>
          <h1>유신 헌법, 대통령에게 권력이 모이다</h1>
          <p>1972년 10월, 박정희 정부는 전국에 비상계엄을 선포하여 국회를 해산하고 헌법을 개정하였다(10월 유신).</p>
        </div>
      </div>
      <div class="fig short"><svg id="svgPower" viewBox="0 0 1000 560" role="img" aria-label="유신 헌법으로 대통령 선출이 통일 주체 국민회의의 간접 선거로 바뀌고, 대통령이 국회의원 1/3 추천권, 국회 해산권, 법관 인사권, 긴급 조치권을 가져 삼권 분립이 무력화됨"></svg></div>
      <div class="scrub">
        <div class="chips" id="chips-power">
          <button type="button" data-t="0">유신 이전</button>
          <button type="button" data-t="3000">대통령 선출</button>
          <button type="button" data-t="7000">국회</button>
          <button type="button" data-t="11500">법원</button>
          <button type="button" data-t="14500">국민</button>
        </div>
        <span class="hint" id="hint-power"></span>
        <button type="button" class="btn" id="next-power">다음 장면 ▶</button>
      </div>
    </section>

    <!-- 10대 국회의원 선거 -->
    <section class="page" id="p-election78" data-name="election78" hidden>
      <div class="head">
        <div>
          <h1>표를 더 얻고도 의석은 적었다</h1>
          <p>1978년 10대 국회의원 선거. 직접 선거인 국회의원 선거에서는 야당이 여당보다 많은 표를 얻었다.</p>
        </div>
      </div>
      <div class="fig short"><svg id="svgElection78" viewBox="0 0 1000 560" role="img" aria-label="득표율은 신민당 32.8%, 민주공화당 31.7%였지만 의석은 민주공화당 68석, 신민당 61석. 여기에 유신 정우회 77석이 더해져 전체 231석"></svg></div>
      <div class="scrub">
        <div class="chips" id="chips-election78">
          <button type="button" data-t="0">득표율</button>
          <button type="button" data-t="4000">의석수</button>
          <button type="button" data-t="8500">유신 정우회</button>
        </div>
        <span class="hint" id="hint-election78"></span>
        <button type="button" class="btn" id="next-election78">다음 장면 ▶</button>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function mk(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function seg(t, a, b) { return clamp((t - a) / (b - a)); }
  function ease(k) { return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
  function easeOut(k) { return 1 - Math.pow(1 - k, 3); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function op(el, v) { el.style.opacity = v.toFixed(3); }
  function at(el, x, y, s) { el.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ")" + (s != null && s !== 1 ? " scale(" + s.toFixed(3) + ")" : "")); }

  // 장면마다 멈추고, 누르면 다음 장면을 재생하는 시간축
  function stepper(name, STOPS, render, svg) {
    var END = STOPS[STOPS.length - 1], t = 0, target = STOPS[0], playing = true, prev = 0;
    var chips = $$("#chips-" + name + " button"), nextBtn = $("#next-" + name), hint = $("#hint-" + name);
    function draw() {
      render(t);
      chips.forEach(function (c, ci) {
        var a = +c.dataset.t, b = ci < chips.length - 1 ? +chips[ci + 1].dataset.t : Infinity;
        c.classList.toggle("on", t >= a && t < b);
      });
      nextBtn.disabled = playing;
      nextBtn.textContent = playing ? "재생 중" : t >= END ? "처음부터 ▶" : "다음 장면 ▶";
      hint.textContent = playing || t >= END ? "" : "그림을 눌러도 넘어갑니다";
    }
    function stopAfter(v) { for (var i = 0; i < STOPS.length; i++) if (STOPS[i] > v) return STOPS[i]; return END; }
    function play(from) { t = from; target = stopAfter(t); playing = true; prev = performance.now(); draw(); }
    function advance() { if (!playing) play(t >= END ? 0 : t); }
    chips.forEach(function (c) { c.addEventListener("click", function () { play(+c.dataset.t); }); });
    nextBtn.addEventListener("click", advance);
    svg.parentNode.addEventListener("click", advance);
    svg.parentNode.style.cursor = "pointer";
    return {
      start: function () { play(0); },
      frame: function (now) { var dt = Math.min(100, now - prev); prev = now; if (!playing) { render(t, true); return; } t += dt; if (t >= target) { t = target; playing = false; } draw(); }
    };
  }
  // 그려지는 화살표
  function arrow(parent, d, color, label, lx, ly, anchor) {
    var g = mk("g", {}, parent);
    var p = mk("path", { d: d, fill: "none", stroke: color, "stroke-width": 3, pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1, "stroke-linecap": "round" }, g);
    var t = label ? mk("text", { x: lx, y: ly, "class": "t", "text-anchor": anchor || "middle", style: "fill:" + color + ";font-weight:700" }, g, label) : null;
    return { g: g, set: function (k) { p.setAttribute("stroke-dashoffset", (1 - k).toFixed(3)); if (t) op(t, seg(k, .7, 1)); } };
  }
  function box(parent, x, y, w, h, title) {
    var g = mk("g", {}, parent);
    var r = mk("rect", { x: x, y: y, width: w, height: h, rx: 6, fill: "var(--sheet)", stroke: "var(--ink)", "stroke-width": 2 }, g);
    var t = mk("text", { x: x + w / 2, y: y + 28, "class": "mid", style: "fill:var(--ink);font-size:19px;font-weight:700" }, g, title);
    return { g: g, r: r, t: t };
  }

  /* ───────── 유신 헌법과 대통령 권한 ───────── */
  var power = (function () {
    var svg = $("#svgPower");
    var PRES = "var(--north)";
    // 삼권 분립 삼각형
    var tri = mk("g", {}, svg);
    mk("path", { d: "M500,160 L190,240 M500,160 L810,240 M190,330 L810,330", fill: "none", stroke: "var(--ink-2)", "stroke-width": 1.5, "stroke-dasharray": "6 5" }, tri);
    var triLab = mk("text", { x: 724, y: 186, "class": "t", style: "fill:var(--ink-2);font-weight:600" }, tri, "삼권 분립");
    // 기관
    var pres = box(svg, 400, 56, 200, 100, "대통령");
    var presSub = mk("text", { x: 500, y: 112, "class": "t2 mid" }, pres.g, "");
    var presSub2 = mk("text", { x: 500, y: 134, "class": "t2 mid" }, pres.g, "");
    var assem = box(svg, 60, 230, 260, 150, "국회");
    var seats = [];
    for (var i = 0; i < 60; i++) seats.push(mk("rect", { x: 84 + (i % 15) * 14.5, y: 278 + Math.floor(i / 15) * 22, width: 10, height: 16, rx: 2, fill: "var(--south)" }, assem.g));
    var court = box(svg, 680, 230, 260, 150, "법원");
    var judges = [];
    for (i = 0; i < 5; i++) judges.push(mk("circle", { cx: 730 + i * 40, cy: 320, r: 13, fill: "var(--ink-2)" }, court.g));
    var ncb = box(svg, 380, 268, 240, 78, "통일 주체 국민회의");
    var ncbSub = mk("text", { x: 500, y: 330, "class": "t2 mid" }, ncb.g, "대통령, 국회의원 1/3 선출");
    // 국민
    var people = mk("g", {}, svg), ppl = [];
    for (i = 0; i < 18; i++) {
      var px = 220 + i * 33.5, pg = mk("g", {}, people);
      mk("circle", { cx: px, cy: 470, r: 7, fill: "var(--ink-2)" }, pg);
      mk("rect", { x: px - 8, y: 480, width: 16, height: 20, rx: 6, fill: "var(--ink-2)" }, pg);
      ppl.push(pg);
    }
    mk("text", { x: 500, y: 532, "class": "tb mid" }, svg, "국민");
    var lock = mk("g", {}, svg);
    mk("rect", { x: -18, y: -8, width: 36, height: 28, rx: 4, fill: PRES }, lock);
    mk("path", { d: "M-10,-8 v-8 a10,10 0 0 1 20,0 v8", fill: "none", stroke: PRES, "stroke-width": 5 }, lock);
    at(lock, 900, 478);
    // 화살표
    var aDirect = arrow(svg, "M440,452 V164", "var(--south)", "직접 선거", 428, 230, "end");
    var xMark = mk("g", {}, svg);
    mk("path", { d: "M415,196 l50,50 M465,196 l-50,50", stroke: "var(--seal)", "stroke-width": 7, "stroke-linecap": "round" }, xMark);
    var aAssem = arrow(svg, "M250,452 C230,430 200,410 190,388", "var(--south)", "국회의원 선거", 250, 425, "start");
    var aNcbIn = arrow(svg, "M560,452 V354", "var(--south)", "직접 선거로 구성", 572, 410, "start");
    var aNcbOut = arrow(svg, "M540,264 V164", PRES, "간접 선거로 대통령 선출", 552, 214, "start");
    var a13 = arrow(svg, "M398,96 C300,96 230,140 210,224", PRES, "국회의원 1/3 추천권", 230, 130, "end");
    var aDiss = arrow(svg, "M398,130 C340,150 330,200 322,226", PRES, "국회 해산권", 352, 200, "start");
    var aJudge = arrow(svg, "M602,96 C700,96 770,140 790,224", PRES, "법관 인사권", 770, 130, "start");
    var aEmer = arrow(svg, "M602,140 C990,140 985,420 905,452", PRES, "긴급 조치권", 880, 420, "middle");
    var basic = mk("text", { x: 890, y: 528, "class": "t mid", style: "fill:var(--seal);font-weight:700" }, svg, "기본권 제한");
    var dissX = mk("rect", { x: 60, y: 230, width: 260, height: 150, rx: 6, fill: "none", stroke: "var(--seal)", "stroke-width": 4, "stroke-dasharray": "10 8" }, svg);
    var cap = mk("text", { x: 30, y: 44, "class": "big", "font-size": 22 }, svg, "");

    function render(t) {
      var B = seg(t, 3200, 4000), B2 = seg(t, 4200, 5200);
      // 유신 이전
      aDirect.set(ease(seg(t, 300, 1200))); op(aDirect.g, 1 - seg(t, 4800, 5400) * .8);
      op(xMark, seg(t, 3400, 3800));
      aAssem.set(ease(seg(t, 900, 1800)));
      op(tri, seg(t, 1400, 2200) * (1 - seg(t, 16800, 17600) * .85));
      triLab.textContent = t < 16800 ? "삼권 분립" : "삼권 분립 무력화";
      triLab.style.fill = t < 16800 ? "var(--ink-2)" : "var(--seal)";
      presSub.textContent = t < 4800 ? "국민이 직접 선출" : "통일 주체 국민회의가 선출";
      presSub2.textContent = t < 4800 ? "3회 연임까지 (3선 개헌)" : "임기 6년 · 중임 제한 없음";
      presSub2.style.fill = t < 4800 ? "var(--ink-2)" : "var(--seal)";
      presSub2.style.fontWeight = t < 4800 ? "400" : "700";
      // 대통령 선출 방법
      op(ncb.g, seg(t, 3600, 4200));
      aNcbIn.set(ease(seg(t, 4000, 4800)));
      aNcbOut.set(ease(seg(t, 4800, 5800)));
      // 국회
      a13.set(ease(seg(t, 7200, 8200)));
      seats.forEach(function (s, k) { var on = k % 3 === 0 && t > 8200 + (k / 3) * 60; s.setAttribute("fill", on ? PRES : "var(--south)"); });
      aDiss.set(ease(seg(t, 9600, 10400)));
      op(dissX, t > 10400 && t < 11500 ? .5 + .5 * Math.abs(Math.sin(t / 160)) : (t >= 11500 ? .55 : 0));
      // 법원
      aJudge.set(ease(seg(t, 11700, 12700)));
      judges.forEach(function (j, k) { j.setAttribute("fill", t > 12700 + k * 120 ? PRES : "var(--ink-2)"); });
      // 국민
      aEmer.set(ease(seg(t, 14700, 15900)));
      op(lock, seg(t, 15900, 16300)); op(basic, seg(t, 15900, 16300));
      ppl.forEach(function (p, k) { p.style.opacity = t > 16000 + k * 25 ? .35 : 1; });
      // 마무리: 대통령이 커짐
      var g = ease(seg(t, 17000, 18000));
      pres.g.setAttribute("transform", "translate(500 106) scale(" + (1 + .12 * g).toFixed(3) + ") translate(-500 -106)");
      pres.r.setAttribute("fill", g > .5 ? "var(--north)" : "var(--sheet)");
      [pres.t, presSub, presSub2].forEach(function (x) { if (g > .5) x.style.fill = "var(--sheet)"; else if (x === pres.t) x.style.fill = "var(--ink)"; });
      cap.textContent = t < 3000 ? "유신 이전: 국민이 대통령과 국회를 직접 선출" : t < 7000 ? "대통령 선출: 직접 선거 → 간접 선거" : t < 11500 ? "국회: 국회의원 1/3 추천권, 국회 해산권" : t < 14500 ? "법원: 법관 인사권" : t < 17000 ? "국민: 긴급 조치로 기본권 제한" : "삼권 분립이 무력화되었다";
      cap.style.fill = t >= 17000 ? "var(--seal)" : "var(--ink)";
    }
    return stepper("power", [2999, 6999, 11499, 14499, 18800], render, svg);
  })();

  /* ───────── 10대 국회의원 선거 (1978) ───────── */
  var election78 = (function () {
    var svg = $("#svgElection78");
    var P = {
      nd: ["신민당", "var(--south)"],
      ut: ["민주통일당", "var(--v3)"],
      ind: ["무소속", "var(--mute)"],
      dr: ["민주공화당", "var(--north)"],
      yj: ["유신 정우회", "var(--gold)"]
    };
    // 득표율 (교과서 그래프)
    mk("text", { x: 40, y: 104, "class": "tb" }, svg, "득표율");
    var VOTES = [["dr", 31.7], ["nd", 32.8], ["ut", 7.4], ["ind", 28.1]];
    var BX = 150, BW = 250, MAXV = 40;
    var bars = VOTES.map(function (v, i) {
      var y = 130 + i * 58;
      mk("text", { x: BX - 10, y: y + 24, "class": "t end" }, svg, P[v[0]][0]);
      mk("rect", { x: BX, y: y, width: BW, height: 36, fill: "var(--paper)" }, svg);
      var r = mk("rect", { x: BX, y: y, width: 0, height: 36, fill: P[v[0]][1] }, svg);
      var tx = mk("text", { x: BX + 6, y: y + 24, "class": "tb" }, svg, "");
      return { r: r, tx: tx, v: v[1], key: v[0] };
    });
    var voteNote = mk("text", { x: BX, y: 384, "class": "tb", style: "fill:var(--south)" }, svg, "야당인 신민당의 득표율이 더 높다");

    // 의석 반원: 왼쪽부터 신민당, 민주통일당, 무소속, 민주공화당, 유신 정우회
    var CX = 725, CY = 430;
    mk("text", { x: CX, y: 104, "class": "tb mid" }, svg, "의석수 (전체 231석)");
    var ORDER = [["nd", 61], ["ut", 3], ["ind", 22], ["dr", 68], ["yj", 77]];
    var seats = (function (n, r0, r1, rows) {
      var radii = [], sum = 0, k;
      for (k = 0; k < rows; k++) { var r = r0 + (r1 - r0) * k / (rows - 1); radii.push(r); sum += r; }
      var counts = radii.map(function (r) { return Math.round(n * r / sum); });
      counts[rows - 1] += n - counts.reduce(function (a, b) { return a + b; }, 0);
      var out = [];
      radii.forEach(function (r, ri) { for (var j = 0; j < counts[ri]; j++) { var a = Math.PI - (j + .5) / counts[ri] * Math.PI; out.push({ x: CX + r * Math.cos(a), y: CY - r * Math.sin(a), a: a, r: r }); } });
      out.sort(function (p, q) { return q.a - p.a || p.r - q.r; });
      return out;
    })(231, 96, 236, 8);
    var idx = 0, gS = mk("g", {}, svg);
    ORDER.forEach(function (o, oi) { for (var j = 0; j < o[1]; j++) { var s = seats[idx++]; s.p = o[0]; s.rank = j; } });
    seats.forEach(function (s) { s.el = mk("circle", { cx: s.x.toFixed(1), cy: s.y.toFixed(1), r: 7, fill: "var(--rule)" }, gS); });
    // 의석 범례
    var legend = mk("g", {}, svg), legNums = {};
    ORDER.forEach(function (o, i) {
      var lx = 490 + i * 98;
      mk("circle", { cx: lx, cy: 470, r: 6, fill: P[o[0]][1] }, legend);
      mk("text", { x: lx + 10, y: 475, "class": "t2", style: "font-size:12px" }, legend, P[o[0]][0]);
      legNums[o[0]] = mk("text", { x: lx + 10, y: 500, "class": "big", "font-size": 22 }, legend, "");
    });
    // 유신 정우회 설명
    var yjNote = mk("g", {}, svg);
    mk("rect", { x: 40, y: 410, width: 410, height: 104, rx: 6, fill: "var(--gold-soft)" }, yjNote);
    mk("text", { x: 58, y: 440, "class": "tb" }, yjNote, "유신 정우회 77석");
    mk("text", { x: 58, y: 466, "class": "t" }, yjNote, "국회의원의 1/3은 대통령의 추천을 받아");
    mk("text", { x: 58, y: 490, "class": "t" }, yjNote, "통일 주체 국민회의에서 선출하였다.");
    var cap = mk("text", { x: 30, y: 548, "class": "t", style: "font-weight:700" }, svg, "");

    function render(t) {
      bars.forEach(function (b, i) {
        var k = ease(seg(t, 300 + i * 250, 1500 + i * 250));
        b.r.setAttribute("width", (BW * b.v / MAXV * k).toFixed(1));
        b.tx.setAttribute("x", (BX + BW * b.v / MAXV * k + 8).toFixed(1));
        b.tx.textContent = k > 0 ? (b.v * k).toFixed(1) + "%" : "";
        var hi = t > 2400 && (b.key === "nd" || b.key === "dr");
        b.r.style.opacity = t > 2400 && !hi ? .35 : 1;
      });
      op(voteNote, seg(t, 2400, 2900));
      var counts = { nd: 0, ut: 0, ind: 0, dr: 0, yj: 0 };
      seats.forEach(function (s) {
        var start = s.p === "yj" ? 8800 : 4300;
        var span = s.p === "yj" ? 1600 : 2200;
        var total = s.p === "yj" ? 77 : 154;
        var order = s.p === "yj" ? s.rank : (s.p === "nd" ? s.rank : s.p === "ut" ? 61 + s.rank : s.p === "ind" ? 64 + s.rank : 86 + s.rank);
        var on = t >= start + order * span / total;
        s.el.setAttribute("fill", on ? P[s.p][1] : "var(--rule)");
        s.el.setAttribute("r", on && s.p === "yj" ? (7 * (1 + .6 * clamp(1 - (t - start - order * span / total) / 250))).toFixed(2) : 7);
        var dim = t > 6800 && t < 8500 && s.p !== "nd" && s.p !== "dr";
        s.el.style.opacity = dim ? .3 : 1;
        if (on) counts[s.p]++;
      });
      Object.keys(legNums).forEach(function (k) { legNums[k].textContent = counts[k] ? counts[k] + "석" : ""; });
      op(legend, seg(t, 4000, 4400));
      op(yjNote, seg(t, 8700, 9300));
      cap.textContent = t < 2400 ? "" : t < 4000 ? "직접 선거인 국회의원 선거에서는 야당이 여당보다 많은 표를 얻었다" : t < 6800 ? "" : t < 8500 ? "그러나 선거 제도의 모순으로 민주공화당이 더 많은 의석을 차지하였다" : t < 10800 ? "" : "여기에 대통령이 추천한 유신 정우회 77석이 더해졌다";
      cap.style.fill = t >= 6800 ? "var(--seal)" : "var(--ink)";
    }
    return stepper("election78", [3999, 8499, 11500], render, svg);
  })();

  /* ── 화면 전환 ── */
  var pages = { power: power, election78: election78 }, names = ["power", "election78"], cur = null;
  function go(name) {
    if (names.indexOf(name) < 0) name = "power";
    names.forEach(function (n) { $("#p-" + n).hidden = n !== name; });
    $$(".tabs a").forEach(function (a) { a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + name)); });
    if (cur !== name) { cur = name; pages[name].start(); }
  }
  $$(".tabs a").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      var n = a.getAttribute("href").slice(1);
      try { history.replaceState(null, "", "#" + n); } catch (err) {}
      go(n);
    });
  });
  window.addEventListener("hashchange", function () { go(location.hash.slice(1)); });
  $("#fsBtn").addEventListener("click", function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { var p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  });
  // 차시 이동 링크: 내 컴퓨터 파일, GitHub 사이트, claude.ai 각각에 맞는 주소
  var LESSONS = {
    1: ["index.html", "/silsub/", "https://claude.ai/artifact/TvCLu1AaMkF7Lt2YpeSu75"],
    2: ["419.html", "/silsub/419/", "https://claude.ai/artifact/WLi4fUxa5aQNsBAGDCghpB"],
    3: ["yushin.html", "/silsub/yushin/", "https://claude.ai/artifact/42jTCQZPoHke5ViLRt8wVe"]
  };
  $$(".lesson-link").forEach(function (a) {
    var L = LESSONS[a.dataset.lesson];
    if (location.protocol === "file:") a.href = L[0];
    else if (/github\.io$/.test(location.hostname)) a.href = L[1];
    else { a.href = L[2]; a.target = "_blank"; a.rel = "noopener"; }
  });
  var segs = location.pathname.split("/").filter(Boolean).map(function (x) { return decodeURIComponent(x).replace(/\.html?$/, ""); });
  if (segs[segs.length - 1] === "index") segs.pop();
  go(location.hash.slice(1) || segs.pop() || "");
  (function loop(now) { if (cur) pages[cur].frame(now); requestAnimationFrame(loop); })(performance.now());
})();
</script>
