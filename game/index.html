<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>개념 도감</title>
<style>
/* 학생 패드용 포획 게임. 인터넷 글꼴 없이 기기 기본 글꼴만 쓴다. 한 가지 밝은 게임 화면으로 고정. */
:root {
  --ink: #1c2321; --paper: #fffdf6; --line: #2a3b47; --accent: #d9493a; --gold: #e8b23a;
  --night: #14201b; --night-2: #22322b; --muted: #6b7a73; --ok: #2f8f5b; --bad: #c0392b;
  --sk1: #e8644f; --sk2: #3f8fd2; --sk3: #4fa65a; --sk4: #b07ad1;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; touch-action: manipulation; color: var(--ink); }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); }

.hud { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--night); color: #f3f6ef; }
.hud .t { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud .who { font-size: 13px; opacity: .75; white-space: nowrap; }
.hud .sp { flex: 1; }
.hbtn { font-weight: 800; font-size: 14px; color: var(--night); background: var(--gold); border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }

#stage { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--night-2); }
#map { display: block; width: min(100vw, calc((100dvh - 56px - env(safe-area-inset-top, 0px)) * 1.5)); max-width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }

/* 조이스틱: 손잡이를 끄는 방향 그대로(360도) 걷는다 */
.stick { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); width: 150px; height: 150px; border-radius: 50%; background: rgba(20, 32, 27, .55); border: 3px solid rgba(255, 255, 255, .55); touch-action: none; cursor: grab; }
.stick::before { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .35); }
.knob { position: absolute; left: 50%; top: 50%; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: var(--gold); border: 4px solid var(--line); box-shadow: 0 4px 0 rgba(0, 0, 0, .3); pointer-events: none; transition: transform .12s ease-out; }
.stick.on .knob { transition: none; }
.tip { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); background: rgba(20, 32, 27, .78); color: #fff; font-size: 14px; padding: 8px 12px; border-radius: 8px; max-width: 46%; }

/* 겹쳐 뜨는 화면 */
.layer { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(20, 32, 27, .55); }
.card { background: var(--paper); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 6px 0 rgba(0, 0, 0, .25); width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 22px; }
.card h1 { margin: 0 0 6px; font-size: 26px; }
.card p { margin: 6px 0; line-height: 1.6; }
.card input[type=text] { width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border: 3px solid var(--line); border-radius: 10px; background: #fff; -webkit-user-select: text; user-select: text; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.big { font-weight: 800; font-size: 18px; padding: 13px 20px; border-radius: 10px; border: 3px solid var(--line); background: var(--gold); cursor: pointer; flex: 1; min-width: 140px; }
.big.alt { background: #fff; }
.big:disabled { opacity: .4; cursor: default; }
.small { font-size: 13px; color: var(--muted); }

#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .75s steps(2) 1; }
@keyframes flash { 0%, 100% { opacity: 0; } 20%, 60% { opacity: 1; } 40%, 80% { opacity: 0; } }

/* ── 배틀 화면 ── */
.battle { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: linear-gradient(#dff1f6 0 55%, #a7d98b 55% 100%); }
.field { position: relative; overflow: hidden; display: flex; gap: 14px; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 14px max(14px, env(safe-area-inset-left, 0px)); }
.qcard { flex: 1.5; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #fff; border: 4px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 5px 0 rgba(0, 0, 0, .2); }
.qcard .qh { background: var(--line); color: #fff; font-weight: 800; font-size: 15px; padding: 6px 12px; display: flex; gap: 10px; }
.qcard .qh span { margin-left: auto; font-weight: 600; opacity: .8; font-size: 12px; }
.qcard .qb { display: grid; place-items: center; padding: 8px; min-height: 0; overflow: auto; }
.qcard img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
.qcard .qt { font-size: clamp(18px, 2.6vw, 26px); font-weight: 700; line-height: 1.55; white-space: pre-wrap; text-align: center; }
.mside { flex: 1; min-width: 0; position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
.battle.intro .mside { flex: 1; }
.nameplate { justify-self: start; background: var(--paper); border: 4px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: min(260px, 100%); box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
.nameplate b { font-size: 20px; }
.gauge { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.gauge .hp { font-size: 13px; font-weight: 900; color: #e8a33a; background: var(--line); border-radius: 4px; padding: 0 6px; letter-spacing: .04em; }
.gauge .bar { flex: 1; height: 12px; border-radius: 6px; background: #dfe6e2; border: 2px solid var(--line); overflow: hidden; }
.gauge .fill { height: 100%; width: 100%; background: #3fbf5f; transition: width .8s ease-out, background-color .4s; }
.gauge .fill.mid { background: #f2c230; } .gauge .fill.low { background: #e5533d; }
.monwrap { position: relative; justify-self: center; align-self: center; width: min(100%, 46vh); aspect-ratio: 1; display: grid; place-items: center; }
.monwrap::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 3%; height: 15%; background: rgba(60, 110, 50, .45); border-radius: 50%; z-index: 0; }
.mon { position: relative; z-index: 1; max-width: 90%; max-height: 90%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .2)); }
.monph { position: relative; z-index: 1; width: 76%; aspect-ratio: 1; border-radius: 50%; background: #c9d6cf; border: 5px dashed #7f938a; display: grid; place-items: center; font-size: 48px; font-weight: 900; color: #5f736a; text-align: center; line-height: 1.1; }
.monph small { display: block; font-size: 14px; font-weight: 700; }
.monwrap.enter { animation: enter .6s ease-out both; }
@keyframes enter { from { transform: translateX(60%); opacity: 0; } to { transform: none; opacity: 1; } }
.monwrap.hit { animation: hit .5s ease-in-out; }
@keyframes hit { 0%, 100% { transform: none; filter: none; } 20%, 60% { transform: translateX(-10px); filter: brightness(1.8); } 40%, 80% { transform: translateX(10px); } }
.monwrap.dodge { animation: dodge .5s ease-in-out; }
@keyframes dodge { 50% { transform: translateY(-24px); } }
.monwrap.suck { animation: suck .5s ease-in forwards; }
@keyframes suck { to { transform: scale(.05); opacity: 0; } }
.monwrap.out { animation: out .4s ease-out both; }
@keyframes out { from { transform: scale(.05); opacity: 0; } to { transform: none; opacity: 1; } }
.monwrap.flee { animation: flee .7s ease-in forwards; }
@keyframes flee { to { transform: translateX(120%); opacity: 0; } }
/* 포획 도구: 선생님이 넣은 그림. 없으면 빈 칸(점선) */
.capsule { position: absolute; width: 64px; height: 64px; left: 4%; bottom: 4%; opacity: 0; z-index: 3; display: grid; place-items: center; }
.capsule img { max-width: 100%; max-height: 100%; object-fit: contain; }
.capsule .empty { width: 100%; height: 100%; border: 3px dashed var(--line); border-radius: 12px; background: rgba(255, 255, 255, .4); }
.capsule.throw { opacity: 1; animation: throw .7s cubic-bezier(.3, .6, .4, 1) forwards; }
@keyframes throw { to { left: var(--tx); bottom: var(--ty); transform: rotate(720deg); } }
.capsule.wob { opacity: 1; left: var(--tx); bottom: var(--ty); animation: wob .5s ease-in-out 3; }
@keyframes wob { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-22deg); } 70% { transform: rotate(22deg); } }
.capsule.burst { opacity: 0; left: var(--tx); bottom: var(--ty); transition: opacity .2s; }
.stars { position: absolute; font-size: 34px; color: var(--gold); opacity: 0; letter-spacing: 8px; text-shadow: 0 2px 0 var(--line); z-index: 3; }
.stars.on { animation: pop .8s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translateY(10px) scale(.5); } 50% { opacity: 1; transform: translateY(-20px) scale(1.2); } 100% { opacity: 0; transform: translateY(-40px); } }

.msg { background: var(--paper); border-top: 5px solid var(--line); padding: 14px max(18px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.msg p { margin: 0; font-size: clamp(18px, 2.5vw, 23px); font-weight: 700; line-height: 1.5; min-height: 1.5em; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; }
.acts:empty { display: none; }
/* 기술 버튼 (2×2) */
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.skills button { position: relative; text-align: left; font-weight: 800; font-size: clamp(16px, 2.2vw, 21px); padding: 14px 16px 14px 46px; border-radius: 12px; border: 3px solid var(--line); background: #fff; cursor: pointer; line-height: 1.3; min-height: 60px; }
.skills button::before { content: attr(data-n); position: absolute; left: 10px; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; background: var(--c); }
.skills button:active { background: #fff6dc; }
.skills.nums button { text-align: center; padding-left: 16px; font-size: 24px; }
.skills.nums button::before { display: none; }

#zoom { position: absolute; inset: 0; background: rgba(0, 0, 0, .9); display: grid; place-items: center; padding: 10px; z-index: 9; }
#zoom img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* 도감 */
.dex { position: absolute; inset: 0; background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.dexhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--line); color: #fff; }
.dexhead b { font-size: 20px; flex: 1; }
.dexgrid { overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content: start; }
.dc { border: 3px solid var(--line); border-radius: 12px; background: #fff; padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.dc .pic { width: 100%; aspect-ratio: 1; display: grid; place-items: center; background: #eef4ea; border-radius: 8px; overflow: hidden; }
.dc .pic img { max-width: 90%; max-height: 90%; object-fit: contain; }
.dc.no .pic img { filter: brightness(0) opacity(.35); }
.dc .pic .ph { font-size: 40px; font-weight: 900; color: #9aaba3; }
.dc .nm { font-weight: 800; font-size: 15px; }
.dc .no-n { color: var(--muted); }
.done { text-align: center; }
.done .trophy { font-size: 64px; }
.stat { display: flex; justify-content: center; gap: 22px; margin: 12px 0; flex-wrap: wrap; }
.stat div { display: grid; }
.stat b { font-size: 26px; }
@media (max-width: 700px) { .field { flex-direction: column; } .qcard { flex: 1.3; } .monwrap { width: min(100%, 26vh); } }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <span class="t" id="gTitle">개념 도감</span>
    <span class="who" id="gWho"></span>
    <span class="sp"></span>
    <button type="button" class="hbtn" id="muteBtn" hidden>소리 켜짐</button>
    <button type="button" class="hbtn" id="dexBtn">도감 0/0</button>
  </div>
  <div id="stage">
    <canvas id="map" width="768" height="512"></canvas>
    <div class="stick" id="stick" aria-label="조이스틱"><div class="knob" id="knob"></div></div>
    <div class="tip" id="tip">조이스틱을 끌어 풀숲(진한 초록)을 돌아다니면 몬스터가 나타나요!</div>
    <div id="flash"></div>

    <div class="layer" id="titleL">
      <div class="card">
        <h1 id="tTitle">개념 도감</h1>
        <p>풀숲을 돌아다니다 몬스터를 만나면 문제를 맞혀 몬스터의 HP를 깎고, 포획 도구를 던져 잡으세요. HP가 낮을수록 잘 잡혀요. 모든 몬스터를 잡으면 도감 완성!</p>
        <p class="small" style="margin-top:14px">내 이름</p>
        <input type="text" id="nameIn" maxlength="12" placeholder="이름을 입력하세요" autocomplete="off">
        <div class="row">
          <button type="button" class="big" id="startBtn">모험 시작!</button>
          <button type="button" class="big alt" id="resetBtn" hidden>처음부터 다시</button>
        </div>
        <p class="small" id="saveInfo"></p>
      </div>
    </div>

    <div class="battle" id="battleL" hidden>
      <div class="field" id="field">
        <div class="qcard" id="qCard" hidden><div class="qh"><b id="qNo"></b><span id="qHint"></span></div><div class="qb" id="qBody"></div></div>
        <div class="mside">
          <div class="nameplate"><b id="bName"></b>
            <div class="gauge"><span class="hp">HP</span><div class="bar"><div class="fill" id="gFill"></div></div></div>
          </div>
          <div class="monwrap" id="bMon"></div>
        </div>
        <div class="capsule" id="bCap"></div>
        <div class="stars" id="bStars">✦✦✦</div>
      </div>
      <div class="msg">
        <p id="bText"></p>
        <div id="bActs"></div>
      </div>
    </div>

    <div class="dex" id="dexL" hidden>
      <div class="dexhead"><b id="dexTitle">도감</b><button type="button" class="hbtn" id="dexClose">닫기</button></div>
      <div class="dexgrid" id="dexGrid"></div>
    </div>

    <div class="layer" id="doneL" hidden>
      <div class="card done">
        <div class="trophy">🏆</div>
        <h1>도감 완성!</h1>
        <p id="doneWho"></p>
        <div class="stat">
          <div><span class="small">잡은 몬스터</span><b id="dCount"></b></div>
          <div><span class="small">맞힌 문제</span><b id="dRight"></b></div>
          <div><span class="small">틀린 문제</span><b id="dWrong"></b></div>
          <div><span class="small">걸린 시간</span><b id="dTime"></b></div>
        </div>
        <div class="row"><button type="button" class="big" id="doneDex">도감 보기</button></div>
      </div>
    </div>

    <div id="zoom" hidden><img alt="문제 크게 보기"></div>
  </div>
</div>

<script id="game-data" type="application/json">{"title": "개념 도감 (샘플)", "rate": 0.25, "step": 0.3, "reveal": false, "ball": "", "ballName": "", "monsters": [{"id": "sample1", "name": "샘플몬", "img": "", "qs": [{"q": "", "qText": "번호형 샘플 문제예요. 정답은 1번!\n(이 자리에 선생님이 만든 문제 사진이 들어가요)", "type": "choice", "choices": 4, "answer": "1", "opts": []}, {"q": "", "qText": "기술형 샘플 문제예요. 알맞은 기술을 고르세요.", "type": "skill", "choices": 4, "answer": "1", "opts": ["정답 기술", "오답 기술 1", "오답 기술 2", "오답 기술 3"]}, {"q": "", "qText": "세 번째 샘플 문제예요. 정답은 2번!", "type": "choice", "choices": 4, "answer": "2", "opts": []}]}, {"id": "sample2", "name": "견본몬", "img": "", "qs": [{"q": "", "qText": "견본몬 문제 1. 정답은 3번!", "type": "choice", "choices": 4, "answer": "3", "opts": []}, {"q": "", "qText": "견본몬 문제 2. 알맞은 기술은?", "type": "skill", "choices": 4, "answer": "2", "opts": ["오답 기술", "정답 기술", "오답 기술 2"]}, {"q": "", "qText": "견본몬 문제 3. 정답은 1번!", "type": "choice", "choices": 4, "answer": "1", "opts": []}]}]}</script>
<script>
(function () {
  "use strict";
  var DATA;
  try { DATA = JSON.parse(document.getElementById("game-data").textContent); }
  catch (e) { DATA = { title: "개념 도감", rate: .2, monsters: [] }; }
  // 예전 형식(몬스터당 문제 1개)도 읽는다
  var MONS = (DATA.monsters || []).map(function (m) {
    if (!m.qs) m.qs = [{ q: m.q, qText: m.qText, type: m.type === "text" ? "skill" : "choice", choices: m.choices, answer: m.type === "text" ? "1" : m.answer, opts: m.type === "text" ? [m.answer] : [] }];
    m.qs = m.qs.filter(function (q) { return q && (q.q || (q.qText || "").trim()); });
    return m;
  });
  var BALL = (DATA.ballName || "").trim() || "포획 도구";
  var STEP = Math.max(.05, Math.min(1, +DATA.step || .3));
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function jong(w) { if (!w) return false; var c = w.charCodeAt(w.length - 1); if (c < 0xAC00 || c > 0xD7A3) return false; return (c - 0xAC00) % 28 !== 0; }
  function j(w, a, b) { return w + (jong(w) ? a : b); }

  /* ── 저장 (기기 안에만) ── */
  var KEY = "dogam2:" + (DATA.title || "") + ":" + MONS.map(function (m) { return m.id; }).join(",");
  var save = { name: "", caught: [], wrong: 0, right: 0, start: 0, end: 0 };
  if (!DATA.preview) { try { var sv = JSON.parse(localStorage.getItem(KEY) || "null"); if (sv && sv.caught) save = sv; } catch (e) {} }
  function store() { if (DATA.preview) return; try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  /* ── 지도 ── */
  var MAP = [
    "TTTTTTTTTTTTTTTTTTTTTTTT",
    "T......GGGG.......WWWWWT",
    "T.GGG..GGGG..FF...WWWWWT",
    "T.GGG..GGGG.......WWWWWT",
    "T.GGG.........GGG..WWW.T",
    "T........==...GGG......T",
    "T==========...GGG..GGG.T",
    "T...F....=.........GGG.T",
    "T.GGGG...=..TT.....GGG.T",
    "T.GGGG...=..TT.........T",
    "T.GGGG...========......T",
    "T.........F.....=..GGGGT",
    "T..WWW..GGGG....=..GGGGT",
    "T..WWW..GGGG..F.=..GGGGT",
    "T.......GGGG....=......T",
    "TTTTTTTTTTTTTTTTTTTTTTTT"
  ];
  var COLS = 24, ROWS = 16, TS = 32;
  function tile(x, y) { if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return "T"; return MAP[y].charAt(x) || "T"; }
  function blockedAt(px, py) { var t = tile(Math.floor(px / TS), Math.floor(py / TS)); return t === "T" || t === "W"; }

  var cv = $("map"), ctx = cv.getContext("2d");
  var bg = document.createElement("canvas"); bg.width = 768; bg.height = 512;
  (function drawBg() {
    var g = bg.getContext("2d"), seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
      var t = tile(x, y), px = x * TS, py = y * TS;
      if (t === "=") { g.fillStyle = "#ead7a2"; g.fillRect(px, py, TS, TS); g.fillStyle = "#d9c285"; for (var k = 0; k < 4; k++) g.fillRect(px + Math.floor(rnd() * 30), py + Math.floor(rnd() * 30), 3, 2); continue; }
      if (t === "W") { g.fillStyle = "#5aa9e6"; g.fillRect(px, py, TS, TS); g.fillStyle = "#8cc8f2"; g.fillRect(px + 4 + Math.floor(rnd() * 8), py + 8, 10, 2); g.fillRect(px + 14 + Math.floor(rnd() * 6), py + 20, 10, 2); continue; }
      g.fillStyle = "#8fd16a"; g.fillRect(px, py, TS, TS); g.fillStyle = "#7fc25b"; for (var i = 0; i < 5; i++) g.fillRect(px + Math.floor(rnd() * 30), py + Math.floor(rnd() * 30), 2, 2);

        g.fillStyle = "#4a9c4b"; g.beginPath(); g.arc(px + 12, py + 10, 6, 0, Math.PI * 2); g.fill();
      }
    }
  })();

  /* ── 주인공: 발 위치(px, py)를 기준으로 자유롭게 이동 ── */
  var P = { x: 9.5 * TS, y: 7.8 * TS, dir: "down", walk: 0, grass: 0, cool: 0 };
  var SPEED = 150, HW = 8, HH = 5;           // 초당 픽셀, 발밑 충돌 상자 절반 크기
  var stickV = { x: 0, y: 0 }, keys = {}, mode = "title", last = 0;

  function render() {

  function loop(now) {

  /* ── 입력: 키보드(대각선 가능) + 조이스틱(360도) ── */
  var KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
  document.addEventListener("keydown", function (e) { if (KEYS[e.key] && mode === "map") { keys[KEYS[e.key]] = true; e.preventDefault(); } });
  document.addEventListener("keyup", function (e) { if (KEYS[e.key]) keys[KEYS[e.key]] = false; });
  window.addEventListener("blur", function () { keys = {}; });
  (function () {
    var st = $("stick"), kn = $("knob"), pid = null;
    function move(e) {
      var r = st.getBoundingClientRect(), R = r.width / 2;

      if (len > lim) { dx = dx / len * lim; dy = dy / len * lim; }
      kn.style.transform = "translate(" + dx.toFixed(0) + "px," + dy.toFixed(0) + "px)";
      var k = Math.min(1, len / lim);
      if (len < R * .15) { stickV = { x: 0, y: 0 }; return; }
      var n = Math.sqrt(dx * dx + dy * dy);

    }
    function end() { pid = null; stickV = { x: 0, y: 0 }; st.classList.remove("on"); kn.style.transform = ""; }
    st.addEventListener("pointerdown", function (e) { e.preventDefault(); pid = e.pointerId; try { st.setPointerCapture(pid); } catch (x) {} st.classList.add("on"); move(e); });
    st.addEventListener("pointermove", function (e) { if (e.pointerId === pid) move(e); });
    st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end); st.addEventListener("lostpointercapture", end);
    st.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  })();

  /* ── 화면 ── */
  function showOnly(id) { ["titleL", "battleL", "dexL", "doneL"].forEach(function (k) { $(k).hidden = k !== id; }); }
  function hud() {
    $("gTitle").textContent = DATA.title || "개념 도감";
    $("gWho").textContent = save.name ? save.name + " 트레이너" : "";
    $("dexBtn").textContent = "도감 " + save.caught.length + "/" + MONS.length;
  }
  function monPic(m) { return m.img ? '<img class="mon" src="' + m.img + '" alt="' + esc(m.name) + '">' : '<div class="monph">?<small>' + esc(m.name) + "</small></div>"; }
  var typing = null;
  function say(text, cb) {
    var el = $("bText"), i = 0;
    if (typing) clearInterval(typing.id);
    el.textContent = "";
    typing = { text: text, cb: cb, id: setInterval(function () {
      i++; el.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typing.id); var c = typing.cb; typing = null; if (c) c(); }
    }, 26) };
  }
  $("bText").addEventListener("click", function () {
    if (!typing) return;
    clearInterval(typing.id); $("bText").textContent = typing.text; var c = typing.cb; typing = null; if (c) c();
  });
  function buttons(list) {
    var box = $("bActs"); box.className = "acts"; box.innerHTML = "";
    list.forEach(function (a) {
      var b = document.createElement("button"); b.type = "button"; b.className = "big" + (a.alt ? " alt" : ""); b.textContent = a.label;
      if (a.disabled) b.disabled = true;
      b.addEventListener("click", a.fn); box.appendChild(b);
    });
  }
  function clearActs() { var box = $("bActs"); box.className = ""; box.innerHTML = ""; }
  function backToMap() { mode = "map"; showOnly(null); hud(); P.cool = 90; music("map"); }

  /* ── 음악: 배경 음악(지도)과 배틀 음악. 첫 터치(모험 시작) 뒤에만 재생할 수 있다 ── */
  var SONG = {}, nowSong = null, muted = false;
  [["map", DATA.bgm], ["battle", DATA.battleBgm]].forEach(function (x) { if (x[1]) { var a = new Audio(x[1]); a.loop = true; a.volume = .55; SONG[x[0]] = a; } });
  function music(which) {
    nowSong = which;
    Object.keys(SONG).forEach(function (k) {
      var a = SONG[k];
      if (k === which && !muted) { if (a.paused) { if (k === "battle") a.currentTime = 0; var pr = a.play(); if (pr && pr.catch) pr.catch(function () {}); } }
      else a.pause();
    });
  }
  if (SONG.map || SONG.battle) {
    $("muteBtn").hidden = false;
    $("muteBtn").addEventListener("click", function () { muted = !muted; this.textContent = muted ? "소리 꺼짐" : "소리 켜짐"; music(nowSong); });
  }
  function anim(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(function () { el.classList.remove(cls); }, ms || 600); }

  /* ── 배틀: 만남 → 문제(최대 3개)를 맞힐 때마다 HP가 깎임 → 포획 도구 던지기 (잡힐 확률 = 깎인 HP 비율) ── */
  var B = null;
  function setGauge() { var hp = Math.round((1 - B.chance) * 100), f = $("gFill"); f.style.width = hp + "%"; f.className = "fill" + (hp <= 20 ? " low" : hp <= 50 ? " mid" : ""); }
  function encounter(m) {
    mode = "battle"; keys = {}; stickV = { x: 0, y: 0 };
    B = { m: m, i: 0, chance: 0 };
    music("battle");
    var fl = $("flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
    setTimeout(function () {
      showOnly("battleL");
      $("qCard").hidden = true;
      $("bName").textContent = m.name;
      setGauge();
      var w = $("bMon"); w.className = "monwrap"; w.innerHTML = monPic(m); void w.offsetWidth; w.classList.add("enter");
      var cap = $("bCap"); cap.className = "capsule"; cap.innerHTML = DATA.ball ? '<img src="' + DATA.ball + '" alt="">' : '<div class="empty"></div>';
      $("bStars").className = "stars";
      clearActs();
      say("앗! 야생의 " + j(m.name, "이", "가") + " 나타났다!", menu);
    }, 760);
  }
  function menu() {
    var m = B.m, more = B.i < m.qs.length;
    buttons([
      { label: more ? "문제 " + (B.i + 1) + " 풀기" : "남은 문제 없음", fn: ask, disabled: !more },
      { label: BALL + " 던지기", fn: throwBall, disabled: B.chance <= 0, alt: true },
      { label: "도망가기", fn: run, alt: true }
    ]);
  }
  function run() { clearActs(); $("qCard").hidden = true; say("무사히 도망쳤다!", function () { setTimeout(backToMap, 500); }); }
  function ask() {
    var m = B.m, q = m.qs[B.i];
    $("qCard").hidden = false;
    $("qNo").textContent = "문제 " + (B.i + 1) + " / " + m.qs.length;
    $("qHint").textContent = q.q ? "사진을 누르면 크게 보여요" : "";

        (q.opts || []).forEach(function (o, k) {

    } else {
      say("정답 번호를 골라 공격하자!", function () {

        var n = Math.max(2, Math.min(9, +q.choices || 4));

      }
    });
  }
  function afterAnswer() { $("qCard").hidden = true; menu(); }
  function throwBall() {
    var m = B.m;
    clearActs(); $("qCard").hidden = true;

  $("zoom").addEventListener("click", function () { $("zoom").hidden = true; });

  /* ── 도감 ── */

  }

  }
  if (!MONS.length) $("saveInfo").textContent = "아직 몬스터가 없어요. 만들기 도구에서 몬스터를 넣어 주세요.";
  function begin() {
    var n = $("nameIn").value.trim();
    if (!n) { $("nameIn").focus(); $("nameIn").placeholder = "이름을 먼저 입력하세요!"; return; }
    save.name = n; if (!save.start) save.start = Date.now(); store();
    hud();
    if (MONS.length && save.caught.length >= MONS.length) { finish(); return; }

  }
  $("startBtn").addEventListener("click", begin);
  $("nameIn").addEventListener("keydown", function (e) { if (e.key === "Enter") begin(); });

    save = { name: $("nameIn").value.trim(), caught: [], wrong: 0, right: 0, start: 0, end: 0 }; store();
    $("startBtn").textContent = "모험 시작!"; $("resetBtn").hidden = true; $("saveInfo").textContent = "";
  });
  hud(); showOnly("titleL");
  requestAnimationFrame(loop);
})();
