<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>개념 도감</title>
<style>
/* 학생 패드용 포획 게임. 인터넷 글꼴 없이 기기 기본 글꼴만 쓴다. 한 가지 밝은 게임 화면으로 고정. */
:root {
  --ink: #1c2321; --paper: #fffdf6; --line: #2a3b47; --accent: #d9493a; --gold: #e8b23a;
  --night: #14201b; --night-2: #22322b; --muted: #6b7a73; --ok: #2f8f5b;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; touch-action: manipulation; }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); }

.hud { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--night); color: #f3f6ef; }
.hud .t { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud .who { font-size: 13px; opacity: .75; white-space: nowrap; }
.hud .sp { flex: 1; }
.hbtn { font-weight: 800; font-size: 14px; color: var(--night); background: var(--gold); border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }

#stage { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--night-2); }
#map { display: block; width: min(100vw, calc((100dvh - 56px - env(safe-area-inset-top, 0px)) * 1.5)); max-width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }

/* 방향 버튼 */
/* 조이스틱: 가운데 손잡이를 끄는 방향으로 걷는다 */
.stick { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); width: 150px; height: 150px; border-radius: 50%; background: rgba(20, 32, 27, .55); border: 3px solid rgba(255, 255, 255, .55); touch-action: none; cursor: grab; }
.stick::before { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .35); }
.knob { position: absolute; left: 50%; top: 50%; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: var(--gold); border: 4px solid var(--line); box-shadow: 0 4px 0 rgba(0, 0, 0, .3); pointer-events: none; transition: transform .12s ease-out; }
.stick.on .knob { transition: none; }
.tip { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); background: rgba(20, 32, 27, .78); color: #fff; font-size: 14px; padding: 8px 12px; border-radius: 8px; max-width: 46%; }

/* 겹쳐 뜨는 화면 */
.layer { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(20, 32, 27, .55); }
.card { background: var(--paper); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 6px 0 rgba(0, 0, 0, .25); width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 22px; }
.card h1 { margin: 0 0 6px; font-size: 26px; }
.card p { margin: 6px 0; line-height: 1.6; }
.card input[type=text] { width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border: 3px solid var(--line); border-radius: 10px; background: #fff; -webkit-user-select: text; user-select: text; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.big { font-weight: 800; font-size: 18px; padding: 13px 20px; border-radius: 10px; border: 3px solid var(--line); background: var(--gold); color: var(--ink); cursor: pointer; flex: 1; min-width: 140px; }
.big.alt { background: #fff; }
.small { font-size: 13px; color: var(--muted); }

#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .75s steps(2) 1; }
@keyframes flash { 0%, 100% { opacity: 0; } 20%, 60% { opacity: 1; } 40%, 80% { opacity: 0; } }

/* 만남 화면 */
.battle { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: linear-gradient(#dff1f6 0 55%, #a7d98b 55% 100%); }
.field { position: relative; overflow: hidden; }
.monwrap { position: absolute; right: 12%; top: 10%; width: min(42vh, 40%); aspect-ratio: 1; display: grid; place-items: center; }
.monwrap::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: 2%; height: 16%; background: rgba(60, 110, 50, .45); border-radius: 50%; z-index: 0; }
.mon { position: relative; z-index: 1; max-width: 92%; max-height: 92%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .2)); }
.monph { position: relative; z-index: 1; width: 78%; aspect-ratio: 1; border-radius: 50%; background: #c9d6cf; border: 5px dashed #7f938a; display: grid; place-items: center; font-size: 48px; font-weight: 900; color: #5f736a; text-align: center; line-height: 1.1; }
.monph small { display: block; font-size: 14px; font-weight: 700; }
.monwrap.enter { animation: enter .6s ease-out both; }
@keyframes enter { from { transform: translateX(60%); opacity: 0; } to { transform: none; opacity: 1; } }
.monwrap.suck { animation: suck .5s ease-in forwards; }
@keyframes suck { to { transform: scale(.05); opacity: 0; } }
.monwrap.flee { animation: flee .7s ease-in forwards; }
@keyframes flee { to { transform: translateX(120%); opacity: 0; } }
.nameplate { position: absolute; left: 6%; top: 10%; background: var(--paper); border: 4px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 800; font-size: 20px; }
.nameplate small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
/* 개념 캡슐 (포획 도구) */
/* 포획 도구: 선생님이 넣은 그림. 없으면 빈 칸(점선)만 보인다 */
.capsule { position: absolute; width: 64px; height: 64px; left: 8%; bottom: 8%; opacity: 0; z-index: 2; display: grid; place-items: center; }
.capsule img { max-width: 100%; max-height: 100%; object-fit: contain; }
.capsule .empty { width: 100%; height: 100%; border: 3px dashed var(--line); border-radius: 12px; background: rgba(255, 255, 255, .4); }
.capsule.throw { opacity: 1; animation: throw .7s cubic-bezier(.3, .6, .4, 1) forwards; }
@keyframes throw { to { left: calc(88% - min(21vh, 20%) - 32px); bottom: 34%; transform: rotate(720deg); } }
.capsule.wob { opacity: 1; left: calc(88% - min(21vh, 20%) - 32px); bottom: 34%; animation: wob .5s ease-in-out 3; }
@keyframes wob { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-22deg); } 70% { transform: rotate(22deg); } }
.stars { position: absolute; left: calc(88% - min(21vh, 20%) - 60px); bottom: 34%; font-size: 34px; color: var(--gold); opacity: 0; letter-spacing: 8px; text-shadow: 0 2px 0 var(--line); }
.stars.on { animation: pop .8s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translateY(10px) scale(.5); } 50% { opacity: 1; transform: translateY(-20px) scale(1.2); } 100% { opacity: 0; transform: translateY(-40px); } }

.msg { background: var(--paper); border-top: 5px solid var(--line); padding: 16px max(18px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.msg p { margin: 0; font-size: clamp(18px, 2.6vw, 24px); font-weight: 700; line-height: 1.5; min-height: 1.5em; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* 문제 화면 */
.quiz { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--paper); }
.qhead { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--line); color: #fff; }
.qhead img, .qhead .qph { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 8px; }
.qhead .qph { display: grid; place-items: center; color: var(--line); font-weight: 900; }
.qhead b { font-size: 18px; }
.qbody { overflow: auto; padding: 14px; display: grid; place-items: center; }
.qimg { max-width: 100%; max-height: 100%; object-fit: contain; border: 3px solid var(--line); border-radius: 8px; background: #fff; cursor: zoom-in; }
.qtext { font-size: clamp(20px, 3vw, 28px); font-weight: 700; line-height: 1.6; white-space: pre-wrap; text-align: center; max-width: 900px; }
.qfoot { border-top: 4px solid var(--line); padding: 12px 16px max(12px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; background: #fff; }
.nums { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.nums button { width: 74px; height: 64px; font-size: 26px; font-weight: 900; border: 3px solid var(--line); border-radius: 12px; background: var(--paper); cursor: pointer; }
.nums button:active { background: var(--gold); }
.txtans { display: flex; gap: 10px; }
.txtans input { flex: 1; min-width: 0; font: inherit; font-size: 22px; padding: 12px 14px; border: 3px solid var(--line); border-radius: 10px; -webkit-user-select: text; user-select: text; }
.qfoot .hint { text-align: center; font-size: 13px; color: var(--muted); }

#zoom { position: absolute; inset: 0; background: rgba(0, 0, 0, .9); display: grid; place-items: center; padding: 10px; z-index: 9; }
#zoom img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* 도감 */
.dex { position: absolute; inset: 0; background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.dexhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--line); color: #fff; }
.dexhead b { font-size: 20px; flex: 1; }
.dexgrid { overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content: start; }
.dc { border: 3px solid var(--line); border-radius: 12px; background: #fff; padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.dc .pic { width: 100%; aspect-ratio: 1; display: grid; place-items: center; background: #eef4ea; border-radius: 8px; overflow: hidden; }
.dc .pic img { max-width: 90%; max-height: 90%; object-fit: contain; }
.dc.no .pic img { filter: brightness(0) opacity(.35); }
.dc .pic .ph { font-size: 40px; font-weight: 900; color: #9aaba3; }
.dc .nm { font-weight: 800; font-size: 15px; }
.dc .no-n { color: var(--muted); }
.done { text-align: center; }
.done .trophy { font-size: 64px; }
.stat { display: flex; justify-content: center; gap: 22px; margin: 12px 0; flex-wrap: wrap; }
.stat div { display: grid; }
.stat b { font-size: 26px; }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <span class="t" id="gTitle">개념 도감</span>
    <span class="who" id="gWho"></span>
    <span class="sp"></span>
    <button type="button" class="hbtn" id="dexBtn">도감 0/0</button>
  </div>
  <div id="stage">
    <canvas id="map" width="768" height="512"></canvas>
    <div class="stick" id="stick" aria-label="조이스틱"><div class="knob" id="knob"></div></div>
    <div class="tip" id="tip">조이스틱을 끌어 풀숲(진한 초록)을 돌아다니면 몬스터가 나타나요!</div>
    <div id="flash"></div>

    <!-- 시작 -->
    <div class="layer" id="titleL">
      <div class="card">
        <h1 id="tTitle">개념 도감</h1>
        <p>풀숲을 돌아다니다 몬스터를 만나면, 문제를 맞혀 포획하세요. 모든 몬스터를 잡으면 도감 완성!</p>
        <p class="small" style="margin-top:14px">내 이름</p>
        <input type="text" id="nameIn" maxlength="12" placeholder="이름을 입력하세요" autocomplete="off">
        <div class="row">
          <button type="button" class="big" id="startBtn">모험 시작!</button>
          <button type="button" class="big alt" id="resetBtn" hidden>처음부터 다시</button>
        </div>
        <p class="small" id="saveInfo"></p>
      </div>
    </div>

    <!-- 만남 -->
    <div class="battle" id="battleL" hidden>
      <div class="field">
        <div class="nameplate" id="bName"></div>
        <div class="monwrap" id="bMon"></div>
        <div class="capsule" id="bCap"></div>
        <div class="stars" id="bStars">✦✦✦</div>
      </div>
      <div class="msg">
        <p id="bText"></p>
        <div class="acts" id="bActs"></div>
      </div>
    </div>

    <!-- 문제 -->
    <div class="quiz" id="quizL" hidden>
      <div class="qhead" id="qHead"></div>
      <div class="qbody" id="qBody"></div>
      <div class="qfoot" id="qFoot"></div>
    </div>

    <!-- 도감 -->
    <div class="dex" id="dexL" hidden>
      <div class="dexhead"><b id="dexTitle">도감</b><button type="button" class="hbtn" id="dexClose">닫기</button></div>
      <div class="dexgrid" id="dexGrid"></div>
    </div>

    <!-- 완성 -->
    <div class="layer" id="doneL" hidden>
      <div class="card done">
        <div class="trophy">🏆</div>
        <h1>도감 완성!</h1>
        <p id="doneWho"></p>
        <div class="stat">
          <div><span class="small">잡은 몬스터</span><b id="dCount"></b></div>
          <div><span class="small">틀린 횟수</span><b id="dWrong"></b></div>
          <div><span class="small">걸린 시간</span><b id="dTime"></b></div>
        </div>
        <div class="row"><button type="button" class="big" id="doneDex">도감 보기</button></div>
      </div>
    </div>

    <div id="zoom" hidden><img alt="문제 크게 보기"></div>
  </div>
</div>

<script id="game-data" type="application/json">{"title": "개념 도감 (샘플)", "rate": 0.25, "reveal": false, "monsters": [{"id": "sample1", "name": "샘플몬", "img": "", "q": "", "qText": "샘플 문제예요. 정답은 1번!\n(이 자리에 선생님이 만든 문제 사진이 들어갑니다)", "type": "choice", "choices": 4, "answer": "1"}, {"id": "sample2", "name": "견본몬", "img": "", "q": "", "qText": "주관식 샘플 문제예요. 정답은 '포획'", "type": "text", "choices": 4, "answer": "포획"}]}</script>
<script>
(function () {
  "use strict";
  var DATA;
  try { DATA = JSON.parse(document.getElementById("game-data").textContent); }
  catch (e) { DATA = { title: "개념 도감", rate: .2, reveal: false, monsters: [] }; }
  var MONS = DATA.monsters || [];
  var BALL = (DATA.ballName || "").trim() || "포획 도구";
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // 받침에 따라 이/가, 을/를, 은/는
  function jong(w) { if (!w) return false; var c = w.charCodeAt(w.length - 1); if (c < 0xAC00 || c > 0xD7A3) return false; return (c - 0xAC00) % 28 !== 0; }
  function j(w, a, b) { return w + (jong(w) ? a : b); }

  /* ── 저장 (기기 안에만) ── */
  var KEY = "dogam:" + (DATA.title || "") + ":" + MONS.map(function (m) { return m.id; }).join(",");
  var save = { name: "", caught: [], wrong: 0, start: 0, end: 0 };
  function load() { if (DATA.preview) return; try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.caught) save = s; } catch (e) {} }
  function store() { if (DATA.preview) return; try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }
  load();

  /* ── 지도 ── */
  var MAP = [
    "TTTTTTTTTTTTTTTTTTTTTTTT",
    "T......GGGG.......WWWWWT",
    "T.GGG..GGGG..FF...WWWWWT",
    "T.GGG..GGGG.......WWWWWT",
    "T.GGG.........GGG..WWW.T",
    "T........==...GGG......T",
    "T==========...GGG..GGG.T",
    "T...F....=.........GGG.T",
    "T.GGGG...=..TT.....GGG.T",
    "T.GGGG...=..TT.........T",
    "T.GGGG...========......T",
    "T.........F.....=..GGGGT",
    "T..WWW..GGGG....=..GGGGT",
    "T..WWW..GGGG..F.=..GGGGT",
    "T.......GGGG....=......T",
    "TTTTTTTTTTTTTTTTTTTTTTTT"
  ];
  var COLS = 24, ROWS = 16, TS = 32;
  function tile(x, y) { if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return "T"; return MAP[y].charAt(x) || "T"; }
  function blocked(x, y) { var t = tile(x, y); return t === "T" || t === "W"; }

  var cv = $("map"), ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  var bg = document.createElement("canvas"); bg.width = 768; bg.height = 512;
  (function drawBg() {
    var g = bg.getContext("2d"), seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    function grassBase(px, py) { g.fillStyle = "#8fd16a"; g.fillRect(px, py, TS, TS); g.fillStyle = "#7fc25b"; for (var i = 0; i < 5; i++) g.fillRect(px + Math.floor(rnd() * 30), py + Math.floor(rnd() * 30), 2, 2); }
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
      var t = tile(x, y), px = x * TS, py = y * TS;
      if (t === "=") { g.fillStyle = "#ead7a2"; g.fillRect(px, py, TS, TS); g.fillStyle = "#d9c285"; for (var k = 0; k < 4; k++) g.fillRect(px + Math.floor(rnd() * 30), py + Math.floor(rnd() * 30), 3, 2); continue; }
      if (t === "W") {
        g.fillStyle = "#5aa9e6"; g.fillRect(px, py, TS, TS);
        g.fillStyle = "#8cc8f2"; g.fillRect(px + 4 + Math.floor(rnd() * 8), py + 8, 10, 2); g.fillRect(px + 14 + Math.floor(rnd() * 6), py + 20, 10, 2);
        continue;
      }
      grassBase(px, py);
      if (t === "G") {
        g.fillStyle = "#5aa947"; g.fillRect(px, py, TS, TS);
        g.fillStyle = "#3f8d39";
        for (var r = 0; r < 2; r++) for (var c = 0; c < 4; c++) {
          var bx = px + c * 8 + 1, by = py + r * 16 + 4;
          g.fillRect(bx, by + 4, 2, 8); g.fillRect(bx + 3, by, 2, 12); g.fillRect(bx + 6, by + 4, 2, 8);
        }
      } else if (t === "F") {
        var cols = ["#f06b5c", "#ffd84d", "#ffffff"];
        for (var f = 0; f < 4; f++) { g.fillStyle = cols[f % 3]; var fx = px + 4 + Math.floor(rnd() * 22), fy = py + 4 + Math.floor(rnd() * 22); g.fillRect(fx, fy, 4, 4); g.fillStyle = "#e0a100"; g.fillRect(fx + 1, fy + 1, 2, 2); }
      } else if (t === "T") {
        g.fillStyle = "#7a4b2a"; g.fillRect(px + 13, py + 20, 6, 10);
        g.fillStyle = "#2f7d3a"; g.beginPath(); g.arc(px + 16, py + 14, 13, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#4a9c4b"; g.beginPath(); g.arc(px + 12, py + 10, 6, 0, Math.PI * 2); g.fill();
      }
    }
  })();

  /* ── 주인공 ── */
  var P = { x: 9, y: 7, dir: "down", moving: null, steps: 0, sinceEnc: 0 };
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var held = null, mode = "title", STEP = 170;
  function drawPlayer(px, py, phase) {
    var c = ctx, d = P.dir, walk = P.moving ? (Math.floor(phase * 2) % 2) : 0;
    c.fillStyle = "rgba(0,0,0,.18)"; c.beginPath(); c.ellipse(px + 16, py + 29, 9, 3.5, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#2a3b47"; c.fillRect(px + 10, py + 22 - (walk ? 1 : 0), 5, 7); c.fillRect(px + 17, py + 22 - (walk ? 0 : 1), 5, 7);
    c.fillStyle = "#2f8f9d"; c.fillRect(px + 9, py + 13, 14, 11);
    c.fillStyle = "#f2c9a0"; c.fillRect(px + 7, py + 15, 3, 6); c.fillRect(px + 22, py + 15, 3, 6);
    c.fillStyle = "#f2c9a0"; c.fillRect(px + 9, py + 3, 14, 11);
    c.fillStyle = "#e8b23a"; c.fillRect(px + 8, py + 1, 16, 5);
    if (d === "down") c.fillRect(px + 9, py + 6, 14, 2);
    if (d === "left") c.fillRect(px + 5, py + 5, 5, 2);
    if (d === "right") c.fillRect(px + 22, py + 5, 5, 2);
    c.fillStyle = "#1c2321";
    if (d === "down") { c.fillRect(px + 12, py + 9, 2, 3); c.fillRect(px + 18, py + 9, 2, 3); }
    if (d === "left") c.fillRect(px + 11, py + 9, 2, 3);
    if (d === "right") c.fillRect(px + 19, py + 9, 2, 3);
    if (d === "up") { c.fillStyle = "#3b2a1e"; c.fillRect(px + 9, py + 6, 14, 6); }
  }
  function render(now) {
    ctx.drawImage(bg, 0, 0);
    var x = P.x, y = P.y, phase = 0;
    if (P.moving) {
      var k = Math.min(1, (now - P.moving.t0) / STEP); phase = k;
      x = P.moving.fx + (P.x - P.moving.fx) * k; y = P.moving.fy + (P.y - P.moving.fy) * k;
    }
    var px = Math.round(x * TS), py = Math.round(y * TS);
    drawPlayer(px, py, phase);
    // 풀숲 위에서는 다리가 풀에 가려짐
    if (tile(Math.round(x), Math.round(y)) === "G") {
      ctx.fillStyle = "#3f8d39";
      for (var c = 0; c < 4; c++) { var bx = px + c * 8 + 1; ctx.fillRect(bx, py + 22, 2, 8); ctx.fillRect(bx + 3, py + 18, 2, 12); ctx.fillRect(bx + 6, py + 22, 2, 8); }
    }
  }
  function tryMove(d, now) {
    P.dir = d;
    var nx = P.x + DIRS[d][0], ny = P.y + DIRS[d][1];
    if (blocked(nx, ny)) return;
    P.moving = { fx: P.x, fy: P.y, t0: now };
    P.x = nx; P.y = ny;
  }
  function arrived() {
    P.sinceEnc++;
    if (tile(P.x, P.y) === "G" && P.sinceEnc >= 3) {
      var left = MONS.filter(function (m) { return save.caught.indexOf(m.id) < 0; });
      if (left.length && Math.random() < (DATA.rate || .2)) { P.sinceEnc = 0; held = null; encounter(left[Math.floor(Math.random() * left.length)]); }
    }
  }
  function loop(now) {
    if (P.moving && now - P.moving.t0 >= STEP) { P.moving = null; arrived(); }
    if (!P.moving && held && mode === "map") tryMove(held, now);
    render(now);
    requestAnimationFrame(loop);
  }

  /* ── 입력 ── */
  var KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
  document.addEventListener("keydown", function (e) {
    if (mode !== "map") return;
    if (KEYS[e.key]) { held = KEYS[e.key]; e.preventDefault(); }
  });
  document.addEventListener("keyup", function (e) { if (KEYS[e.key] === held) held = null; });
  // 조이스틱: 손잡이가 많이 기운 쪽(가로/세로)으로 한 칸씩 걷는다
  (function () {
    var st = $("stick"), kn = $("knob"), pid = null;
    function move(e) {
      var r = st.getBoundingClientRect(), R = r.width / 2;
      var dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R), len = Math.sqrt(dx * dx + dy * dy), lim = R * .62;
      if (len > lim) { dx = dx / len * lim; dy = dy / len * lim; }
      kn.style.transform = "translate(" + dx.toFixed(0) + "px," + dy.toFixed(0) + "px)";
      if (len < R * .22 || mode !== "map") { held = null; return; }
      held = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    }
    function end() { pid = null; held = null; st.classList.remove("on"); kn.style.transform = ""; }
    st.addEventListener("pointerdown", function (e) { e.preventDefault(); pid = e.pointerId; try { st.setPointerCapture(pid); } catch (x) {} st.classList.add("on"); move(e); });
    st.addEventListener("pointermove", function (e) { if (e.pointerId === pid) move(e); });
    st.addEventListener("pointerup", end); st.addEventListener("pointercancel", end); st.addEventListener("lostpointercapture", end);
    st.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  })();

  /* ── 화면 표시 ── */
  function showOnly(id) { ["titleL", "battleL", "quizL", "dexL", "doneL"].forEach(function (k) { $(k).hidden = k !== id; }); }
  function hud() {
    $("gTitle").textContent = DATA.title || "개념 도감";
    $("gWho").textContent = save.name ? save.name + " 트레이너" : "";
    $("dexBtn").textContent = "도감 " + save.caught.length + "/" + MONS.length;
  }
  function monPic(m, cls) {
    return m.img ? '<img class="' + (cls || "mon") + '" src="' + m.img + '" alt="' + esc(m.name) + '">' : '<div class="monph">?<small>' + esc(m.name) + '</small></div>';
  }
  var typing = null;
  function say(text, cb) {
    var el = $("bText"), i = 0;
    if (typing) clearInterval(typing.id);
    el.textContent = "";
    typing = { text: text, cb: cb, id: setInterval(function () {
      i++; el.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typing.id); var c = typing.cb; typing = null; if (c) c(); }
    }, 28) };
  }
  $("bText").parentNode.addEventListener("click", function () {
    if (!typing) return;
    clearInterval(typing.id); $("bText").textContent = typing.text; var c = typing.cb; typing = null; if (c) c();
  });
  function acts(list) {
    var box = $("bActs"); box.innerHTML = "";
    list.forEach(function (a) {
      var b = document.createElement("button"); b.type = "button"; b.className = "big" + (a.alt ? " alt" : ""); b.textContent = a.label;
      b.addEventListener("click", a.fn); box.appendChild(b);
    });
  }
  function backToMap() { mode = "map"; showOnly(null); hud(); }

  /* ── 만남 → 문제 → 포획 ── */
  var cur = null;
  function encounter(m) {
    cur = m; mode = "battle";
    var fl = $("flash"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
    setTimeout(function () {
      showOnly("battleL");
      $("bName").innerHTML = esc(m.name) + "<small>야생</small>";
      var w = $("bMon"); w.className = "monwrap"; w.innerHTML = monPic(m); void w.offsetWidth; w.classList.add("enter");
      $("bCap").className = "capsule"; $("bCap").innerHTML = DATA.ball ? '<img src="' + DATA.ball + '" alt="">' : '<div class="empty"></div>'; $("bStars").className = "stars";
      acts([]);
      say("앗! 야생의 " + j(m.name, "이", "가") + " 나타났다!", function () {
        acts([{ label: "문제 풀고 잡기", fn: quiz }, { label: "도망가기", alt: true, fn: run }]);
      });
    }, 760);
  }
  function run() { acts([]); say("무사히 도망쳤다!", function () { setTimeout(backToMap, 500); }); }
  function quiz() {
    var m = cur; mode = "quiz"; showOnly("quizL");
    $("qHead").innerHTML = (m.img ? '<img src="' + m.img + '" alt="">' : '<div class="qph">?</div>') + "<b>" + esc(m.name) + " 포획 문제</b>";
    var body = $("qBody");
    if (m.q) { body.innerHTML = '<img class="qimg" src="' + m.q + '" alt="문제">'; body.firstChild.addEventListener("click", function () { var z = $("zoom"); z.firstChild.src = m.q; z.hidden = false; }); }
    else body.innerHTML = '<div class="qtext">' + esc(m.qText || "(문제가 아직 없어요)") + "</div>";
    var foot = $("qFoot");
    if (m.type === "text") {
      foot.innerHTML = '<div class="txtans"><input type="text" id="ansIn" placeholder="정답을 입력하세요" autocomplete="off"><button type="button" class="big" id="ansGo" style="flex:none;min-width:110px">확인</button></div><div class="hint">' + (m.q ? "문제 사진을 누르면 크게 볼 수 있어요" : "") + "</div>";
      var inp = $("ansIn");
      $("ansGo").addEventListener("click", function () { check(inp.value); });
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") check(inp.value); });
    } else {
      var n = Math.max(2, Math.min(9, +m.choices || 4)), h = '<div class="nums">';
      for (var i = 1; i <= n; i++) h += '<button type="button" data-n="' + i + '">' + i + "</button>";
      foot.innerHTML = h + '</div><div class="hint">정답 번호를 누르세요' + (m.q ? " · 문제 사진을 누르면 크게 볼 수 있어요" : "") + "</div>";
      Array.prototype.forEach.call(foot.querySelectorAll(".nums button"), function (b) { b.addEventListener("click", function () { check(b.dataset.n); }); });
    }
  }
  function norm(s) { return String(s || "").toLowerCase().replace(/[\s·.,'"‘’“”()\[\]~!?-]/g, ""); }
  function check(v) {
    var m = cur, ok;
    if (m.type === "text") ok = String(m.answer || "").split(/[,/]/).some(function (a) { return norm(a) && norm(a) === norm(v); });
    else ok = String(v) === String(m.answer);
    mode = "battle"; showOnly("battleL"); acts([]);
    if (ok) {
      say("정답! " + j(BALL, "을", "를") + " 던졌다!", function () {
        var cap = $("bCap"); cap.className = "capsule throw";
        setTimeout(function () { $("bMon").classList.add("suck"); }, 650);
        setTimeout(function () { cap.className = "capsule wob"; }, 1150);
        setTimeout(function () {
          $("bStars").className = "stars on";
          if (save.caught.indexOf(m.id) < 0) save.caught.push(m.id);
          store(); hud();
          say("신난다! " + j(m.name, "을", "를") + " 잡았다!", function () {
            var all = save.caught.length >= MONS.length;
            acts([{ label: all ? "도감 완성 확인!" : "계속 탐험하기", fn: all ? finish : backToMap }]);
          });
        }, 2700);
      });
    } else {
      save.wrong++; store();
      var msg = "아쉽다! " + j(m.name, "은", "는") + " 도망쳐 버렸다…";
      if (DATA.reveal) msg += " (정답: " + (m.type === "text" ? String(m.answer).split(/[,/]/)[0] : m.answer + "번") + ")";
      say(msg, function () { $("bMon").classList.add("flee"); acts([{ label: "다시 찾으러 가기", fn: backToMap }]); });
    }
  }
  $("zoom").addEventListener("click", function () { $("zoom").hidden = true; });

  /* ── 도감 ── */
  function openDex() {
    var prevMode = mode; mode = "dex"; showOnly("dexL");
    $("dexTitle").textContent = "도감  " + save.caught.length + " / " + MONS.length;
    $("dexGrid").innerHTML = MONS.map(function (m, i) {
      var got = save.caught.indexOf(m.id) >= 0;
      var pic = m.img ? '<img src="' + m.img + '" alt="">' : '<span class="ph">?</span>';
      return '<div class="dc' + (got ? "" : " no") + '"><div class="pic">' + pic + '</div><div class="nm' + (got ? "" : " no-n") + '">No.' + (i + 1) + " " + (got ? esc(m.name) : "???") + "</div></div>";
    }).join("");
    $("dexClose").onclick = function () { if (save.caught.length >= MONS.length && MONS.length) finish(); else backToMap(); };
  }
  $("dexBtn").addEventListener("click", function () { if (mode === "map" || mode === "done") openDex(); });

  /* ── 완성 ── */
  function finish() {
    mode = "done"; if (!save.end) { save.end = Date.now(); store(); }
    showOnly("doneL");
    $("doneWho").textContent = (save.name ? j(save.name, "이", "가") + " " : "") + "모든 몬스터를 잡았어요!";
    $("dCount").textContent = save.caught.length + "마리";
    $("dWrong").textContent = save.wrong + "번";
    var sec = Math.max(0, Math.round(((save.end || Date.now()) - (save.start || Date.now())) / 1000));
    $("dTime").textContent = Math.floor(sec / 60) + "분 " + (sec % 60) + "초";
  }
  $("doneDex").addEventListener("click", openDex);

  /* ── 시작 ── */
  $("tTitle").textContent = DATA.title || "개념 도감";
  if (save.name) $("nameIn").value = save.name;
  if (save.caught.length) {
    $("startBtn").textContent = "이어서 하기";
    $("resetBtn").hidden = false;
    $("saveInfo").textContent = "지금까지 " + save.caught.length + "/" + MONS.length + "마리를 잡았어요.";
  }
  if (!MONS.length) $("saveInfo").textContent = "아직 몬스터가 없어요. 만들기 도구에서 몬스터를 넣어 주세요.";
  function begin() {
    var n = $("nameIn").value.trim();
    if (!n) { $("nameIn").focus(); $("nameIn").placeholder = "이름을 먼저 입력하세요!"; return; }
    save.name = n; if (!save.start) save.start = Date.now(); store();
    hud();
    if (MONS.length && save.caught.length >= MONS.length) { finish(); return; }
    backToMap();
    setTimeout(function () { $("tip").hidden = true; }, 6000);
  }
  $("startBtn").addEventListener("click", begin);
  $("nameIn").addEventListener("keydown", function (e) { if (e.key === "Enter") begin(); });
  $("resetBtn").addEventListener("click", function () {
    save = { name: $("nameIn").value.trim(), caught: [], wrong: 0, start: 0, end: 0 }; store();
    $("startBtn").textContent = "모험 시작!"; $("resetBtn").hidden = true; $("saveInfo").textContent = "";
  });
  hud(); showOnly("titleL");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
