<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>개념 도감</title>
<style>
/* 학생 패드용 포획 게임. 인터넷 글꼴 없이 기기 기본 글꼴만 쓴다. 한 가지 밝은 게임 화면으로 고정. */
:root {
  --ink: #1c2321; --paper: #fffdf6; --line: #2a3b47; --accent: #d9493a; --gold: #e8b23a;
  --night: #14201b; --night-2: #22322b; --muted: #6b7a73; --ok: #2f8f5b; --bad: #c0392b;
  --sk1: #e8644f; --sk2: #3f8fd2; --sk3: #4fa65a; --sk4: #b07ad1;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; touch-action: manipulation; color: var(--ink); }
#app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); }

.hud { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--night); color: #f3f6ef; }
.hud .t { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hud .who { font-size: 13px; opacity: .75; white-space: nowrap; }
.hud .sp { flex: 1; }
.hbtn { font-weight: 800; font-size: 14px; color: var(--night); background: var(--gold); border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }

#stage { position: relative; display: grid; place-items: center; overflow: hidden; background: var(--night-2); }
#map { display: block; width: min(100vw, calc((100dvh - 56px - env(safe-area-inset-top, 0px)) * 1.5)); max-width: 100%; aspect-ratio: 3 / 2; }

/* 조이스틱: 손잡이를 끄는 방향 그대로(360도) 걷는다 */
.stick { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); width: 150px; height: 150px; border-radius: 50%; background: rgba(20, 32, 27, .55); border: 3px solid rgba(255, 255, 255, .55); touch-action: none; cursor: grab; }
.stick::before { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .35); }
.knob { position: absolute; left: 50%; top: 50%; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: var(--gold); border: 4px solid var(--line); box-shadow: 0 4px 0 rgba(0, 0, 0, .3); pointer-events: none; transition: transform .12s ease-out; }
.stick.on .knob { transition: none; }
.tip { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); background: rgba(20, 32, 27, .78); color: #fff; font-size: 14px; padding: 8px 12px; border-radius: 8px; max-width: 46%; }

/* 겹쳐 뜨는 화면 */
.layer { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(20, 32, 27, .55); }
.card { background: var(--paper); border: 4px solid var(--line); border-radius: 14px; box-shadow: 0 6px 0 rgba(0, 0, 0, .25); width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 22px; }
.card h1 { margin: 0 0 6px; font-size: 26px; }
.card p { margin: 6px 0; line-height: 1.6; }
.card input[type=text] { width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border: 3px solid var(--line); border-radius: 10px; background: #fff; -webkit-user-select: text; user-select: text; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.big { font-weight: 800; font-size: 18px; padding: 13px 20px; border-radius: 10px; border: 3px solid var(--line); background: var(--gold); cursor: pointer; flex: 1; min-width: 140px; }
.big.alt { background: #fff; }
.big:disabled { opacity: .4; cursor: default; }
.small { font-size: 13px; color: var(--muted); }

#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
/* 포획 연출용 요소(평소엔 투명)가 힌트·필기 버튼 위에 겹쳐 눌림을 막지 않게 */
.capsule, .stars { pointer-events: none; }
#flash.go { animation: flash .75s steps(2) 1; }
/* 지도↔마을 이동: 몬스터를 만날 때(하얀 번쩍임)와 다르게, 화면이 동그랗게 닫혔다가 열린다 */
#warp { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-radius: 50%; pointer-events: none; opacity: 0; box-shadow: 0 0 0 200vmax #14201b; transform: translate(-50%, -50%); z-index: 2; }
#warp.go { animation: iris 1s ease-in-out 1; }
@keyframes iris { 0% { width: 260vmax; height: 260vmax; opacity: 1; } 42%, 58% { width: 0; height: 0; opacity: 1; } 100% { width: 260vmax; height: 260vmax; opacity: 1; } }
@keyframes flash { 0%, 100% { opacity: 0; } 20%, 60% { opacity: 1; } 40%, 80% { opacity: 0; } }

/* ── 배틀 화면 ── */
.battle { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; overflow: hidden; background: linear-gradient(#dff1f6 0 55%, #a7d98b 55% 100%); }
.field { position: relative; overflow: hidden; display: flex; gap: 14px; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 14px max(14px, env(safe-area-inset-left, 0px)); }
.qcard { flex: 1.5; min-width: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: #fff; border: 4px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 5px 0 rgba(0, 0, 0, .2); }
.qcard .qh { background: var(--line); color: #fff; font-weight: 800; font-size: 15px; padding: 6px 12px; display: flex; gap: 10px; }
.qcard .qh { align-items: center; flex-wrap: wrap; }
/* 필기 도구 */
.itools { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tb { font-weight: 800; font-size: 13px; color: #fff; background: transparent; border: 2px solid rgba(255, 255, 255, .8); border-radius: 7px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
.tb.on { background: var(--gold); color: var(--line); border-color: var(--gold); }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; padding: 0; cursor: pointer; background: var(--c); }
.sw.on { box-shadow: 0 0 0 3px var(--gold); }
.ink { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); pointer-events: none; touch-action: none; }
.inking .ink { pointer-events: auto; cursor: crosshair; }
.qcard .qb { position: relative; display: grid; place-items: center; padding: 8px; min-height: 0; overflow: auto; }
/* 문제 사진은 카드 크기에 맞춰 통째로 보이게(잘리지 않게) */
.qcard .qb img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); object-fit: contain; cursor: zoom-in; }
.qcard .qtx { padding: 8px 14px; font-size: clamp(16px, 2.2vw, 21px); font-weight: 700; line-height: 1.5; white-space: pre-wrap; border-bottom: 2px solid var(--rule, #d5dcd8); max-height: 9em; overflow: auto; }
.qcard .qt { font-size: clamp(18px, 2.6vw, 26px); font-weight: 700; line-height: 1.55; white-space: pre-wrap; text-align: center; }
.mside { flex: 1; min-width: 0; position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
.battle.intro .mside { flex: 1; }
.nameplate { justify-self: start; background: var(--paper); border: 4px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: min(260px, 100%); box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
.nameplate b { font-size: 20px; }
.gauge { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.gauge .hp { font-size: 13px; font-weight: 900; color: #e8a33a; background: var(--line); border-radius: 4px; padding: 0 6px; letter-spacing: .04em; }
.gauge .bar { flex: 1; height: 12px; border-radius: 6px; background: #dfe6e2; border: 2px solid var(--line); overflow: hidden; }
.gauge .fill { height: 100%; width: 100%; background: #3fbf5f; transition: width .8s ease-out, background-color .4s; }
.gauge .fill.mid { background: #f2c230; } .gauge .fill.low { background: #e5533d; }
.monwrap { position: relative; justify-self: center; align-self: center; width: min(100%, 46vh); aspect-ratio: 1; display: grid; place-items: center; }
.monwrap::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 3%; height: 15%; background: rgba(60, 110, 50, .45); border-radius: 50%; z-index: 0; }
.mon { position: relative; z-index: 1; max-width: 90%; max-height: 90%; object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .2)); }
.monph { position: relative; z-index: 1; width: 76%; aspect-ratio: 1; border-radius: 50%; background: #c9d6cf; border: 5px dashed #7f938a; display: grid; place-items: center; font-size: 48px; font-weight: 900; color: #5f736a; text-align: center; line-height: 1.1; }
.monph small { display: block; font-size: 14px; font-weight: 700; }
.monwrap.enter { animation: enter .6s ease-out both; }
@keyframes enter { from { transform: translateX(60%); opacity: 0; } to { transform: none; opacity: 1; } }
.monwrap.hit { animation: hit .5s ease-in-out; }
@keyframes hit { 0%, 100% { transform: none; filter: none; } 20%, 60% { transform: translateX(-10px); filter: brightness(1.8); } 40%, 80% { transform: translateX(10px); } }
.monwrap.dodge { animation: dodge .5s ease-in-out; }
@keyframes dodge { 50% { transform: translateY(-24px); } }
.monwrap.suck { animation: suck .5s ease-in forwards; }
@keyframes suck { to { transform: scale(.05); opacity: 0; } }
.monwrap.out { animation: out .4s ease-out both; }
@keyframes out { from { transform: scale(.05); opacity: 0; } to { transform: none; opacity: 1; } }
.monwrap.flee { animation: flee .7s ease-in forwards; }
@keyframes flee { to { transform: translateX(120%); opacity: 0; } }
/* 포획 도구: 선생님이 넣은 그림. 없으면 빈 칸(점선) */
.capsule { position: absolute; width: 64px; height: 64px; left: 4%; bottom: 4%; opacity: 0; z-index: 3; display: grid; place-items: center; }
.capsule img { max-width: 100%; max-height: 100%; object-fit: contain; }
.capsule .empty { width: 100%; height: 100%; border: 3px dashed var(--line); border-radius: 12px; background: rgba(255, 255, 255, .4); }
.capsule.throw { opacity: 1; animation: throw .7s cubic-bezier(.3, .6, .4, 1) forwards; }
@keyframes throw { to { left: var(--tx); bottom: var(--ty); transform: rotate(720deg); } }
.capsule.wob { opacity: 1; left: var(--tx); bottom: var(--ty); animation: wob .5s ease-in-out 3; }
@keyframes wob { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-22deg); } 70% { transform: rotate(22deg); } }
.capsule.burst { opacity: 0; left: var(--tx); bottom: var(--ty); transition: opacity .2s; }
.stars { position: absolute; font-size: 34px; color: var(--gold); opacity: 0; letter-spacing: 8px; text-shadow: 0 2px 0 var(--line); z-index: 3; }
.stars.on { animation: pop .8s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translateY(10px) scale(.5); } 50% { opacity: 1; transform: translateY(-20px) scale(1.2); } 100% { opacity: 0; transform: translateY(-40px); } }

.msg { grid-template-columns: minmax(0, 1fr); background: var(--paper); border-top: 5px solid var(--line); padding: 14px max(18px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.msg p { margin: 0; font-size: clamp(18px, 2.5vw, 23px); font-weight: 700; line-height: 1.5; min-height: 1.5em; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; }
.acts:empty { display: none; }
/* 기술 버튼 (2×2) */
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.skills button { position: relative; text-align: left; font-weight: 800; font-size: clamp(16px, 2.2vw, 21px); padding: 14px 16px 14px 46px; border-radius: 12px; border: 3px solid var(--line); background: #fff; cursor: pointer; line-height: 1.3; min-height: 60px; }
.skills button::before { content: attr(data-n); position: absolute; left: 10px; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; background: var(--c); }
.skills button:active { background: #fff6dc; }
.skills.nums button { text-align: center; padding-left: 16px; font-size: 24px; }
.skills.nums button::before { display: none; }
/* 글자 입력(주관식) */
.typeans { display: flex; gap: 10px; }
.typeans input { flex: 1; min-width: 0; width: 0; font: inherit; font-size: 22px; font-weight: 700; padding: 12px 14px; border: 3px solid var(--line); border-radius: 12px; background: #fff; -webkit-user-select: text; user-select: text; }
.typeans .big { flex: none; min-width: 120px; }

#zoom { position: absolute; inset: 0; background: rgba(0, 0, 0, .92); display: grid; grid-template-rows: auto minmax(0, 1fr); z-index: 9; }
#zoom .zbar { display: flex; align-items: center; gap: 10px; padding: 10px max(12px, env(safe-area-inset-left, 0px)); background: var(--line); color: #fff; }
#zoom .zbar b { font-size: 15px; }
#zoom .zarea { position: relative; margin: 10px; }
#zoom .zarea img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); object-fit: contain; }

/* 도감 */
.dex { position: absolute; inset: 0; background: var(--paper); display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.dextabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px 0; }
.dextabs button { font-weight: 800; font-size: 14px; border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.dextabs button.on { background: var(--line); color: #fff; }
.dextabs button small { font-weight: 700; opacity: .75; margin-left: 4px; }
.dc .rg { font-size: 12px; color: var(--muted); }
.dexhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--line); color: #fff; }
.dexhead b { font-size: 20px; flex: 1; }
.dexgrid { overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content: start; }
.dc { font: inherit; color: var(--ink); border: 3px solid var(--line); border-radius: 12px; background: #fff; padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; }
/* 해설 */
.qcard { position: relative; }
.exp { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 4px solid var(--line); padding: 12px 16px; display: grid; gap: 6px; max-height: 60%; overflow: auto; animation: expin .3s ease-out; }
@keyframes expin { from { transform: translateY(30%); opacity: 0; } to { transform: none; opacity: 1; } }
/* 힌트 */
.hintb:disabled { opacity: .6; cursor: default; }
.hintb.ready { background: #ffd84d; color: var(--line); border-color: #ffd84d; animation: glow 1.2s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(255, 216, 77, .45); } }
.hintp { position: absolute; left: 0; right: 0; top: 38px; background: #fff7d1; border-bottom: 4px solid var(--line); padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; z-index: 2; animation: expin .3s ease-out; }
.hintp p { margin: 0; flex: 1; font-size: clamp(16px, 2.2vw, 19px); font-weight: 700; line-height: 1.55; white-space: pre-wrap; }
.hintp button { flex: none; font: 700 13px inherit; border: 2px solid var(--line); background: #fff; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.exp b { font-size: 18px; } .exp.ok b { color: var(--ok); } .exp.no b { color: var(--bad); }
.exp .ans { font-weight: 800; font-size: 16px; }
.exp p { margin: 0; font-size: clamp(16px, 2.2vw, 19px); line-height: 1.6; white-space: pre-wrap; }
.dc .pic { width: 100%; aspect-ratio: 1; display: grid; place-items: center; background: #eef4ea; border-radius: 8px; overflow: hidden; }
.dc .pic img { max-width: 90%; max-height: 90%; object-fit: contain; }
.dc.no .pic img { filter: brightness(0) opacity(.35); }
.dc .pic .ph { font-size: 40px; font-weight: 900; color: #9aaba3; }
.dc .nm { font-weight: 800; font-size: 15px; }
/* 보스 */
.dc.boss { border-color: #6d3fa8; background: #f6f0ff; }
.bosstag { display: inline-block; vertical-align: 2px; margin-right: 6px; font-size: 12px; font-weight: 900; letter-spacing: .06em; color: #fff; background: #6d3fa8; border-radius: 4px; padding: 1px 6px; }
.battle.boss { background: linear-gradient(#e6dcf5 0 55%, #9fc98a 55% 100%); }
.battle.boss .nameplate { border-color: #6d3fa8; }
.dc .no-n { color: var(--muted); }
.done { text-align: center; }
.done .trophy { font-size: 64px; }
.stat { display: flex; justify-content: center; gap: 22px; margin: 12px 0; flex-wrap: wrap; }
.stat div { display: grid; }
.stat b { font-size: 26px; }
/* 세로 화면: 문제 카드를 위에 크게, 이름표와 몬스터는 아래 한 줄에 */
@media (orientation: portrait), (max-width: 700px) {
  .field { flex-direction: column; }
  .qcard { flex: 2; }
  .mside { flex: 1; grid-template-columns: minmax(190px, 42%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); align-items: center; }
  .nameplate { align-self: start; justify-self: stretch; min-width: 0; }
  .monwrap { width: min(100%, 30vh); height: auto; }
}
/* 폰 가로 화면(높이가 낮음): 왼쪽에 문제 카드를 크게, 오른쪽에 대화창과 버튼 */
@media (orientation: landscape) and (max-height: 500px) {
  .hud { padding-block: 5px; } .hbtn { padding: 6px 10px; }
  .battle { grid-template-columns: minmax(0, 1fr) minmax(250px, 40%); grid-template-rows: minmax(0, 1fr); background: linear-gradient(#dff1f6 0 62%, #a7d98b 62% 100%); }
  .field { flex-direction: column; gap: 8px; padding: 8px 10px 8px max(10px, env(safe-area-inset-left, 0px)); }
  .qcard { flex: 1; }
  .qcard .qh { padding: 4px 10px; font-size: 14px; }
  .mside { flex: none; height: 78px; grid-template-columns: minmax(150px, 55%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); align-items: center; }
  .qcard[hidden] + .mside { flex: 1; height: auto; }
  .qcard[hidden] + .mside .monwrap { height: auto; width: min(100%, 52vh); }
  .nameplate { align-self: center; justify-self: stretch; min-width: 0; padding: 5px 10px; } .nameplate b { font-size: 16px; }
  .gauge { margin-top: 3px; }
  .monwrap { width: auto; height: 100%; max-width: 100%; }
  .msg { border-top: 0; border-left: 5px solid var(--line); align-content: start; overflow: auto; gap: 10px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) 12px; }
  .msg p { font-size: 17px; }
  .acts { flex-direction: column; flex-wrap: nowrap; } .acts .big { flex: none; min-width: 0; font-size: 16px; padding: 10px; }
  .skills { gap: 8px; } .skills button { font-size: 15px; padding: 10px 8px 10px 38px; min-height: 46px; }
  .skills.nums button { font-size: 20px; padding-left: 8px; }
  .typeans input { font-size: 18px; padding: 10px; } .typeans .big { min-width: 76px; padding-inline: 10px; font-size: 16px; }
  .itools { gap: 4px; } .tb { padding: 2px 7px; font-size: 12px; } .sw { width: 22px; height: 22px; }
  .stick { width: 120px; height: 120px; left: max(10px, env(safe-area-inset-left, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
  .knob { width: 54px; height: 54px; margin: -27px 0 0 -27px; }
  .tip { font-size: 13px; max-width: max(120px, calc(50vw - (100dvh - 40px) * .75 - 20px)); }
  .card { padding: 14px 18px; } .card h1 { font-size: 21px; }
}
/* Netlify 주소에서는 오른쪽 아래 'Powered by Netlify' 표시가 버튼을 가리지 않도록 아래 여백을 둔다 */
@media (max-width: 480px) {
  .mside { grid-template-columns: minmax(150px, 48%) minmax(0, 1fr); }
  .nameplate { padding: 6px 10px; } .nameplate b { font-size: 17px; }
  .msg { gap: 10px; padding-top: 10px; } .msg p { font-size: 16px; }
  .typeans .big { min-width: 84px; padding-inline: 12px; }
  .acts .big { min-width: 0; font-size: 16px; padding: 12px 10px; }
  .skills button { font-size: 16px; padding: 12px 10px 12px 40px; min-height: 52px; }
  .itools { gap: 4px; } .tb { padding: 3px 7px; font-size: 12px; }
}
body.badge-gap .msg { padding-bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 62px); }
body.badge-gap .tip { bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 62px); }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <span class="t" id="gTitle">개념 도감</span>

    window.addEventListener("resize", function () { setTimeout(redraw, 60); });
    return {
      clear: function (s) { strokes = []; on = false; src = s || ""; views = views.filter(function (v) { return v.box.id === "zArea"; }); refresh(); },
      attach: attach, redraw: redraw, refresh: refresh, src: function () { return src; }
    };
  })();
  var zoomAttached = false;
  function openZoom() {
    if (!INK.src()) return;
    var z = $("zoom"), img = $("zImg");
    img.src = INK.src(); z.hidden = false;
    if (!zoomAttached) { INK.attach($("zArea"), img, $("zInk")); zoomAttached = true; }
    INK.refresh(); setTimeout(INK.redraw, 30);
  }
  $("zClose").addEventListener("click", function () { $("zoom").hidden = true; INK.redraw(); });
  $("zArea").addEventListener("click", function (e) { if (!$("zArea").classList.contains("inking") && e.target === $("zImg")) { $("zoom").hidden = true; INK.redraw(); } });

  /* ── 도감 ── */
  function dexCard(m, i, withRegion) {
    var got = save.caught.indexOf(m.id) >= 0;
    var pic = m.img ? '<img src="' + m.img + '" alt="">' : '<span class="ph">?</span>';
    return '<div class="dc' + (got ? "" : " no") + '"><div class="pic">' + pic + '</div><div class="nm' + (got ? "" : " no-n") + '">No.' + (i + 1) + " " + (got ? esc(m.name) : "???") + "</div>" + (withRegion ? '<div class="rg">' + esc(PLACES[m.pl].name) + "</div>" : "") + "</div>";
  }
  function bossCard() {
    var got = !!save.boss, pic = BOSS.img ? '<img src="' + BOSS.img + '" alt="">' : '<span class="ph">?</span>';
    return '<div class="dc boss' + (got ? "" : " no") + '"><div class="pic">' + pic + '</div><div class="nm' + (got ? "" : " no-n") + '"><span class="bosstag">BOSS</span>' + (got ? esc(BOSS.name) : "???") + "</div>" + (EU ? '<div class="rg">' + WATERLOO.name + "</div>" : "") + "</div>";
  }
  // 유럽 지도에서는 '전체 도감'과 지역마다의 '지역 도감'을 나눠 보여 준다
  function openDex(tab) {
    mode = "dex"; showOnly("dexL");
    if (tab == null) tab = EU && scene === "town" ? TOWN : "all";
    var tabs = $("dexTabs"); tabs.hidden = !EU;
    if (EU) {
      var used = PLACES.map(function (pl, k) { return k; }).filter(placeHas);
      tabs.innerHTML = "";
      [["all", "전체 도감", save.caught.length + "/" + MONS.length]].concat(used.map(function (k) {
        var all = MONS.filter(function (m) { return m.pl === k; }).length;
        return [k, PLACES[k].name, (all - placeLeft(k).length) + "/" + all];
      })).forEach(function (t) {
        var b = document.createElement("button"); b.type = "button"; b.className = t[0] === tab ? "on" : "";
        b.innerHTML = esc(t[1]) + "<small>" + t[2] + "</small>";
        b.addEventListener("click", function () { openDex(t[0]); });
        tabs.appendChild(b);
      });
    }
    var list = MONS.map(function (m, i) { return [m, i]; });
    if (tab !== "all") {
      list = list.filter(function (x) { return x[0].pl === tab; });
      var got = list.filter(function (x) { return save.caught.indexOf(x[0].id) >= 0; }).length;
      $("dexTitle").textContent = PLACES[tab].name + " 도감  " + got + " / " + list.length + (got < list.length ? "  · 이 지역에서 잡아야 할 몬스터" : "  · 이 지역 점령 완료!");
    } else $("dexTitle").textContent = (EU ? "전체 도감  " : "도감  ") + save.caught.length + " / " + MONS.length;
    $("dexGrid").innerHTML = list.map(function (x) { return dexCard(x[0], x[1], EU && tab === "all"); }).join("") + (BOSS && tab === "all" ? bossCard() : "");
    $("dexClose").onclick = function () { if (complete()) finish(); else backToMap(); };
  }
  $("dexBtn").addEventListener("click", function () { if (mode === "map" || mode === "done") openDex(); });

  function finish() {
    music("map");
    mode = "done"; if (!save.end) { save.end = Date.now(); store(); }
    showOnly("doneL");
    $("doneWho").textContent = (save.name ? j(save.name, "이", "가") + " " : "") + (BOSS ? "모든 몬스터와 보스까지 잡았어요!" : "모든 몬스터를 잡았어요!");
    $("dCount").textContent = save.caught.length + "마리" + (BOSS && save.boss ? " + 보스" : "");
    $("dRight").textContent = (save.right || 0) + "개";
    $("dWrong").textContent = save.wrong + "개";
    var sec = Math.max(0, Math.round(((save.end || Date.now()) - (save.start || Date.now())) / 1000));
    $("dTime").textContent = Math.floor(sec / 60) + "분 " + (sec % 60) + "초";
  }
  $("doneDex").addEventListener("click", function () { openDex(); });

  /* ── 시작 ── */
  $("tTitle").textContent = DATA.title || "개념 도감";
  if (EU) { var src = document.createElement("p"); src.className = "small"; src.textContent = "지도 자료: 해안선 Natural Earth · 1800년 무렵 국경 historical-basemaps(GPL-3.0)"; document.querySelector("#titleL .card").appendChild(src); }
  if (EU) { var tq = document.querySelector("#titleL p"); tq.textContent = "파리에서 출발해 지도의 빨간 원으로 표시된 곳을 차례로 찾아가세요. 도착하면 그곳 마을로 들어가요. 마을 풀숲을 돌아다니다 몬스터를 만나면 문제를 맞혀 HP를 깎고 포획 도구를 던져 잡으세요. 그 마을의 몬스터를 모두 잡으면 다시 지도로 나와 다음 곳으로 갈 수 있어요. 바다는 배를 타고 건널 수 있어요."; }
  if (BOSS) { var tp = document.querySelector("#titleL p"); tp.textContent = tp.textContent.replace("모든 몬스터를 잡으면 도감 완성!", "모든 몬스터를 잡으면 마지막으로 보스가 나타나요. 보스까지 잡으면 도감 완성!"); }
  if (save.name) $("nameIn").value = save.name;
  if (save.caught.length) {
    $("startBtn").textContent = "이어서 하기"; $("resetBtn").hidden = false;
    $("saveInfo").textContent = "지금까지 " + save.caught.length + "/" + MONS.length + "마리를 잡았어요.";
  }
  if (!MONS.length) $("saveInfo").textContent = "아직 몬스터가 없어요. 만들기 도구에서 몬스터를 넣어 주세요.";
  function begin() {
    var n = $("nameIn").value.trim();
    if (!n) { $("nameIn").focus(); $("nameIn").placeholder = "이름을 먼저 입력하세요!"; return; }
    save.name = n; if (!save.start) save.start = Date.now(); store();
    hud();
    if (complete()) { finish(); return; }
    if (EU) PLACES.forEach(function (pl, k) { if (placeHas(k) && !placeLeft(k).length) conquerAt[k] = -1e9; });
    backToMap(); P.cool = 0;
    if (!bossOut()) setTimeout(function () { $("tip").hidden = true; }, 7000);
  }
  $("startBtn").addEventListener("click", begin);
  $("nameIn").addEventListener("keydown", function (e) { if (e.key === "Enter") begin(); });
  $("resetBtn").addEventListener("click", function () {
    save = { name: $("nameIn").value.trim(), caught: [], wrong: 0, right: 0, start: 0, end: 0 }; store();
    $("startBtn").textContent = "모험 시작!"; $("resetBtn").hidden = true; $("saveInfo").textContent = "";
  });
  hud(); showOnly("titleL");
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
